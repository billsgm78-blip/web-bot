<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Malika uchun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07030a;overflow:hidden;font-family:Montserrat,sans-serif;color:#ffd6ea}
  canvas#c{position:fixed;inset:0;display:block;cursor:pointer}
  .bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#2a0d22 0%,#12060f 45%,#050206 100%);z-index:-1}
  .ui{position:fixed;left:0;right:0;bottom:3.5vh;display:flex;justify-content:center;pointer-events:none}
  .btn{pointer-events:auto;border:1px solid rgba(255,140,198,.55);background:rgba(255,79,163,.12);color:#ffd6ea;
       padding:10px 22px;border-radius:999px;font:300 14px Montserrat,sans-serif;letter-spacing:.12em;cursor:pointer;
       backdrop-filter:blur(6px);transition:opacity .8s,transform .3s;box-shadow:0 0 24px rgba(255,79,163,.25)}
  .btn:hover{transform:scale(1.05);background:rgba(255,79,163,.22)}
  .hide{opacity:0;pointer-events:none}
  /* ---- countdown + gift ---- */
  .cd{position:fixed;left:50%;top:3.2vh;transform:translate(-50%,-14px);opacity:0;transition:opacity 1.4s,transform 1.4s;
      text-align:center;pointer-events:none;z-index:5;width:min(94vw,520px)}
  .cd.on{opacity:1;transform:translate(-50%,0)}
  .cd .t{font:300 12px Montserrat,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#ffb3d6;margin-bottom:10px;text-shadow:0 0 12px rgba(255,79,163,.6)}
  .cd .row{display:flex;justify-content:center;gap:min(2.4vw,12px)}
  .cd .u{min-width:min(18vw,84px);padding:10px 4px 8px;border-radius:16px;border:1px solid rgba(255,140,198,.35);
         background:linear-gradient(160deg,rgba(255,79,163,.16),rgba(80,10,50,.18));backdrop-filter:blur(8px);
         box-shadow:0 0 26px rgba(255,79,163,.18),inset 0 0 18px rgba(255,180,220,.06)}
  .cd .n{font:700 clamp(24px,7vw,40px) Montserrat,sans-serif;color:#fff;text-shadow:0 0 14px rgba(255,79,163,.9),0 0 34px rgba(255,79,163,.45);font-variant-numeric:tabular-nums}
  .cd .n.tick{animation:tick .5s ease}
  @keyframes tick{0%{transform:translateY(-6px) scale(1.12);opacity:.5}100%{transform:none;opacity:1}}
  .cd .l{font:300 10px Montserrat,sans-serif;letter-spacing:.18em;color:#ffc6e1;margin-top:4px;text-transform:uppercase}
  .cd .s{font:400 clamp(26px,6vw,34px) "Great Vibes",cursive;color:#ffd6ea;margin-top:8px;text-shadow:0 0 16px rgba(255,79,163,.6)}
  .gift{pointer-events:auto;font-size:16px;padding:14px 30px;letter-spacing:.14em;animation:pulse 1.8s ease-in-out infinite;
        background:linear-gradient(135deg,rgba(255,79,163,.45),rgba(255,140,198,.25))}
  @keyframes pulse{0%,100%{box-shadow:0 0 22px rgba(255,79,163,.4);transform:scale(1)}50%{box-shadow:0 0 46px rgba(255,79,163,.85);transform:scale(1.06)}}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(7,3,10,.55);
      backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .6s}
  .ov.on{opacity:1;pointer-events:auto}
  .card{width:min(90vw,420px);padding:28px 24px 24px;border-radius:26px;border:1px solid rgba(255,140,198,.45);
        background:linear-gradient(165deg,rgba(60,12,44,.92),rgba(20,6,18,.94));box-shadow:0 0 60px rgba(255,79,163,.35);
        text-align:center;transform:translateY(20px) scale(.96);transition:transform .6s cubic-bezier(.2,1.4,.4,1)}
  .ov.on .card{transform:none}
  .card h2{margin:0 0 6px;font:400 40px "Great Vibes",cursive;color:#fff;text-shadow:0 0 18px rgba(255,79,163,.7)}
  .card p{margin:0 0 18px;font:300 15px/1.5 Montserrat,sans-serif;color:#ffd6ea}
  .card .q{font-weight:700;font-size:17px;color:#fff}
  .card input,.card textarea{width:100%;box-sizing:border-box;margin:0 0 12px;padding:13px 16px;border-radius:14px;
        border:1px solid rgba(255,140,198,.4);background:rgba(255,255,255,.06);color:#fff;font:400 16px Montserrat,sans-serif;outline:none;resize:none}
  .card input:focus,.card textarea:focus{border-color:#ff6fb1;box-shadow:0 0 0 3px rgba(255,79,163,.2)}
  .card input::placeholder,.card textarea::placeholder{color:rgba(255,214,234,.45)}
  .card .btn{width:100%;padding:14px;font-size:15px;margin-top:4px;background:linear-gradient(135deg,#ff4fa3,#c8005f);border:0;font-weight:700}
  .card .err{color:#ff9db0;font-size:13px;min-height:18px;margin:-4px 0 8px}
  .step{display:none}.step.on{display:block;animation:fadeup .6s ease}
  @keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .big{font-size:58px;line-height:1;margin-bottom:8px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .heart{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:fly 1.6s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="c"></canvas>
<div class="ui"><button id="open" class="btn">Konvertni oching ♡</button></div>
<div class="ui"><button id="giftBtn" class="btn gift hide">🎁 Sovg'ani olish</button></div>

<div id="cd" class="cd">
  <div class="t" id="cdTitle">16-dekabrgacha qoldi</div>
  <div class="row" id="cdRow">
    <div class="u"><div class="n" id="cdD">00</div><div class="l">kun</div></div>
    <div class="u"><div class="n" id="cdH">00</div><div class="l">soat</div></div>
    <div class="u"><div class="n" id="cdM">00</div><div class="l">daqiqa</div></div>
    <div class="u"><div class="n" id="cdS">00</div><div class="l">soniya</div></div>
  </div>
  <div class="s" id="cdSub">sizni bir sovg'a kutyapti ♡</div>
</div>

<div id="ov" class="ov"><div class="card">
  <div class="step on" id="st1">
    <h2>Bitta savol ♡</h2>
    <p class="q" id="qText">…</p>
    <textarea id="ans" rows="3" placeholder="Javobingizni yozing…"></textarea>
    <div class="err" id="e1"></div>
    <button class="btn" id="b1">Javob berish</button>
  </div>
  <div class="step" id="st2">
    <div class="big">💖</div>
    <h2>To'g'ri!</h2>
    <p>Sovg'ani olish uchun karta raqamingiz va ism-familiyangizni yozing</p>
    <input id="card" inputmode="numeric" autocomplete="cc-number" placeholder="8600 0000 0000 0000" maxlength="23">
    <input id="fio" autocomplete="name" placeholder="Ism familiya">
    <div class="err" id="e2"></div>
    <button class="btn" id="b2">Yuborish ♡</button>
  </div>
  <div class="step" id="st3">
    <div class="big">🎁</div>
    <h2>Rahmat, Malika!</h2>
    <p>Bilol'dan sovg'ani kuting ♡</p>
  </div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
  const NAME = "Malika";
  const SMALL = "faqat siz uchun";
  const ENV_TEXT = "SIZ UCHUN";

  try { await Promise.all([document.fonts.load('200px "Great Vibes"'), document.fonts.load('700 80px Montserrat'), document.fonts.load('300 80px Montserrat')]); } catch(e){}

  const mobile = innerWidth < 700;
  const N = mobile ? 11000 : 22000;

  // ---------- three setup ----------
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  // render at the screen's native resolution (Retina / 4K), capped at 3x
  const PR = Math.min(devicePixelRatio || 1, 3);
  renderer.setPixelRatio(PR);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  const group = new THREE.Group(); scene.add(group);

  function resize(){
    const w = innerWidth, h = innerHeight, a = w/h;
    renderer.setSize(w,h); camera.aspect = a;
    const k = 2*Math.tan(THREE.MathUtils.degToRad(25));
    camera.position.z = Math.max(5.7/k, (a<1?5.9:6.6)/(k*a));
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const vert = `
    attribute vec3 color; attribute float rnd;
    uniform float uTime, uSize;
    varying vec3 vC; varying float vA;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * (0.55 + 0.9*rnd) / -mv.z;
      vC = color;
      vA = 0.55 + 0.45*sin(uTime*2.5 + rnd*60.0);
    }`;
  const frag = `
    varying vec3 vC; varying float vA;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d>0.5) discard;
      float core = smoothstep(0.22, 0.0, d);
      float halo = smoothstep(0.5, 0.0, d); halo*=halo*0.35;
      float a = core + halo;
      gl_FragColor = vec4(vC*(0.85+0.6*core), a*vA);
    }`;
  function makeMat(size){
    return new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uSize:{value:size*PR}},vertexShader:vert,fragmentShader:frag,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  }

  // background stars
  {
    const M = 1600, p = new Float32Array(M*3), c = new Float32Array(M*3), r = new Float32Array(M);
    for(let i=0;i<M;i++){
      const R = 12+Math.random()*25, t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      p[i*3]=R*Math.sin(ph)*Math.cos(t); p[i*3+1]=R*Math.sin(ph)*Math.sin(t); p[i*3+2]=-Math.abs(R*Math.cos(ph))*0.8;
      const pink = Math.random()<0.35; c[i*3]=pink?1:0.85; c[i*3+1]=pink?0.55:0.8; c[i*3+2]=pink?0.8:0.95; r[i]=Math.random();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    g.setAttribute('color',new THREE.BufferAttribute(c,3));
    g.setAttribute('rnd',new THREE.BufferAttribute(r,1));
    var stars = new THREE.Points(g, makeMat(mobile?40:48)); scene.add(stars);
  }

  // main particles
  const pos = new Float32Array(N*3), tgt = new Float32Array(N*3), col = new Float32Array(N*3), tcol = new Float32Array(N*3);
  const rnd = new Float32Array(N), ease = new Float32Array(N);
  for(let i=0;i<N;i++){
    rnd[i]=Math.random(); ease[i]=0.025+Math.random()*0.05;
    const R=6+Math.random()*6, t=Math.random()*6.283, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=R*Math.sin(ph)*Math.cos(t); pos[i*3+1]=R*Math.sin(ph)*Math.sin(t); pos[i*3+2]=R*Math.cos(ph);
    col[i*3]=1; col[i*3+1]=0.4; col[i*3+2]=0.7;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setAttribute('rnd', new THREE.BufferAttribute(rnd,1));
  const mat = makeMat(mobile?38:34);
  group.add(new THREE.Points(geo, mat));

  // ---------- shape sampling ----------
  function sample(draw, cw, ch, worldW, step=2){
    const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    const ctx=cv.getContext('2d'); draw(ctx,cw,ch);
    const d=ctx.getImageData(0,0,cw,ch).data, out=[];
    for(let y=0;y<ch;y+=step) for(let x=0;x<cw;x+=step)
      if(d[(y*cw+x)*4+3]>110) out.push([(x-cw/2)/cw*worldW, -(y-ch/2)/cw*worldW]);
    return out.length?out:[[0,0]];
  }
  const pick = a => a[(Math.random()*a.length)|0];
  const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];

  // envelope
  const envLines = sample((c,w,h)=>{
    c.strokeStyle='#fff'; c.lineWidth=7; c.lineJoin='round';
    const x0=240,y0=64,x1=w-240,y1=h-64;
    c.strokeRect(x0,y0,x1-x0,y1-y0);
    c.beginPath(); c.moveTo(x0,y0); c.lineTo(w/2,h*0.52); c.lineTo(x1,y0); c.stroke();
    c.beginPath(); c.moveTo(x0,y1); c.lineTo(w*0.4,h*0.6); c.moveTo(x1,y1); c.lineTo(w*0.6,h*0.6); c.stroke();
    c.fillStyle='#fff'; c.font='700 100px Montserrat'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(ENV_TEXT, w/2, h*0.76);
  }, 1600, 1024, 5.6);
  const envHeart = sample((c,w,h)=>{
    c.fillStyle='#fff'; c.beginPath();
    for(let t=0;t<=6.3;t+=0.02){ const x=16*Math.pow(Math.sin(t),3), y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      c.lineTo(w/2+x*5.1, h*0.47-y*5.1); }
    c.fill();
  }, 1600, 1024, 5.6);

  // name
  const nameFont = (c,w,h,txt,size)=>{ c.fillStyle='#fff'; c.font=size+'px "Great Vibes"'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(txt,w/2,h/2); };
  const namePts = sample((c,w,h)=>nameFont(c,w,h,NAME,500), 2000, 700, 6.2, 2);
  const smallPts = sample((c,w,h)=>{ c.fillStyle='#fff'; c.font='300 120px Montserrat'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(SMALL.split('').join(String.fromCharCode(8202)),w/2,h/2); }, 2000, 260, 2.5, 2);

  // rose (3D, centred on x=0)
  function roseHead(){
    // layered, slightly spiralled petals: closed bud inside, open curled petals outside
    const l = Math.pow(Math.random(),0.65);            // 0 inner ... 1 outer
    const th = Math.random()*Math.PI*2;
    const nP = l<0.35?3:(l<0.7?4:5), phase = l*11.0;
    const lobe = Math.pow(Math.abs(Math.sin(nP*(th+phase)/2)),0.5);
    const v = 1 - Math.pow(Math.random(),3.2);          // 0 base ... 1 petal edge (denser at edges)
    const S = 1.2;
    const R = (0.10 + 0.9*l) * (0.78 + 0.22*lobe) * S * 0.5;
    // cup profile: bulges out, inner petals close at top, outer petals flare/curl outwards
    let r = R * (0.45 + 0.55*Math.sin(v*Math.PI*(0.62 - 0.12*(1-l)))) ;
    r *= 1 + l*l*0.55*Math.pow(v,3);
    let y = 0.5 + v*S*(0.95 - 0.25*l*l) ;
    y -= l*l*0.18*Math.pow(v,5) + (1-lobe)*0.08*v*l;    // dips between petals, outer tips droop
    const edge = Math.pow(v,8);
    return {p:[r*Math.cos(th), y, r*Math.sin(th)], c: mix(mix(hex('#c8004f'), hex('#ff3d93'), 0.3+0.7*l), hex('#ffd1e6'), edge*0.85)};
  }
  function roseStem(){
    const y = 0.6 - Math.random()*1.7, a=Math.random()*6.283, rr=0.025+Math.random()*0.02;
    return {p:[0.07*Math.sin(y*2.2)+rr*Math.cos(a), y, rr*Math.sin(a)], c: hex('#2ee59d')};
  }
  function roseLeaf(){
    const left = Math.random()<0.5, s=Math.random(), w=Math.sin(Math.PI*s)*0.2;
    const bx = left? -0.02 : 0.05, by = left? -0.35 : -0.05, dx = left? -1 : 1;
    const ang = left? 0.5 : 0.35, L=0.75;
    const along=[dx*Math.cos(ang)*s*L, Math.sin(ang)*s*L + 0.12*Math.sin(s*Math.PI)], perp=[-Math.sin(ang)*dx, Math.cos(ang)];
    const o=(Math.random()-0.5)*2*w*(Math.random()<0.4?1:Math.sqrt(Math.random()));
    return {p:[bx+along[0]+perp[0]*o*dx, by+along[1]+perp[1]*o, (Math.random()-0.5)*0.05 + s*0.1], c: mix(hex('#1fbf7a'),hex('#7dffc6'),Math.random()*0.4)};
  }
  function mix(a,b,t){ t=Math.min(1,Math.max(0,t)); return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }

  const nHead = Math.floor(N*0.56), nStem = Math.floor(N*0.07), nLeaf = Math.floor(N*0.07), nSmall=Math.floor(N*0.06);
  const roseBase = new Float32Array(N*3); // rotating part (head, stem, leaf)
  const roseCol = new Float32Array(N*3);
  const ROSE_END = nHead+nStem+nLeaf;
  for(let i=0;i<N;i++){
    let s;
    if(i<nHead) s=roseHead(); else if(i<nHead+nStem) s=roseStem(); else if(i<ROSE_END) s=roseLeaf();
    else if(i<ROSE_END+nSmall){ const q=pick(smallPts); s={p:[q[0], q[1]-1.45, 0], c:hex('#ffe3f0')}; }
    else { const q=pick(namePts); s={p:[q[0]*0.7+(Math.random()-0.5)*0.005, q[1]*0.7-2.2, (Math.random()-0.5)*0.06], c:mix(hex('#ff7ab8'),hex('#ffe0ef'),Math.random())}; }
    roseBase.set(s.p,i*3); roseCol.set(s.c,i*3);
  }

  // ---------- phases ----------
  let phase=0, phaseT=0;
  const vortexA = new Float32Array(N), vortexR = new Float32Array(N);
  for(let i=0;i<N;i++){ vortexA[i]=Math.random()*6.283; vortexR[i]=0.15+Math.pow(Math.random(),0.6)*2.9; }

  function setPhase(p){
    phase=p; phaseT=0;
    for(let i=0;i<N;i++){
      let q,c,z=(Math.random()-0.5)*0.08;
      if(p===0){
        if(i<N*0.18){ q=pick(envHeart); c=hex('#ff2d86'); }
        else { q=pick(envLines); c=mix(hex('#ffc4e0'),hex('#ffffff'),Math.random()*0.6); }
        tgt[i*3]=q[0]; tgt[i*3+1]=q[1]+0.2; tgt[i*3+2]=z;
      } else if(p===1){
        c=mix(hex('#ff1f7a'),hex('#ff9ccc'),vortexR[i]/3);
      } else if(p===2){
        q=pick(namePts); c=mix(hex('#ff5fa8'),hex('#ffd9ec'),Math.random()*0.7);
        tgt[i*3]=q[0]; tgt[i*3+1]=q[1]+0.1; tgt[i*3+2]=z*0.5;
      } else {
        c=[roseCol[i*3],roseCol[i*3+1],roseCol[i*3+2]];
      }
      tcol[i*3]=c[0]; tcol[i*3+1]=c[1]; tcol[i*3+2]=c[2];
    }
    // spread each particle's arrival for a nicer morph
    for(let i=0;i<N;i++) ease[i]=(p===3? 0.012:0.02)+Math.random()*0.045;
  }
  setPhase(0);

  const openBtn=document.getElementById('open');
  function openEnvelope(){ if(phase!==0) return; openBtn.classList.add('hide'); setPhase(1); }
  openBtn.onclick=e=>{e.stopPropagation(); openEnvelope();};
  canvas.addEventListener('click', openEnvelope);
  let countdownShown=false;

  let mx=0,my=0;
  addEventListener('pointermove',e=>{ mx=e.clientX/innerWidth-0.5; my=e.clientY/innerHeight-0.5; });

  // ---------- loop ----------
  let last=performance.now(), time=0;
  function tick(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now; time+=dt; phaseT+=dt;
    mat.uniforms.uTime.value=time; stars.material.uniforms.uTime.value=time;
    stars.rotation.z+=dt*0.01;

    if(phase===1 && phaseT>2.6) setPhase(2);
    else if(phase===2 && phaseT>3.4) setPhase(3);
    else if(phase===3 && phaseT>3.2 && !countdownShown){ countdownShown=true; startCountdown(); }

    const TC=Math.cos(0.45), TS=Math.sin(0.45);
    const rotA = time*0.45, ca=Math.cos(rotA), sa=Math.sin(rotA);
    const f = dt*60;
    for(let i=0;i<N;i++){
      const j=i*3; let tx,ty,tz;
      if(phase===1){
        const r=vortexR[i], a=vortexA[i]+time*(2.2/(r+0.4));
        const grow=Math.min(1,phaseT/0.8);
        tx=r*Math.cos(a)*grow*1.15; ty=r*Math.sin(a)*0.32*grow+0.3+Math.sin(a*3+time)*0.04; tz=r*Math.sin(a)*0.5*grow;
      } else if(phase===3){
        const bx=roseBase[j], by=roseBase[j+1], bz=roseBase[j+2];
        if(i<ROSE_END){ tx=bx*ca+bz*sa; tz=-bx*sa+bz*ca; ty=by+0.15;
          if(i<nHead){ // tilt bloom towards viewer (after spinning) so the inner spiral shows
            const yy=ty-0.9, z0=tz; ty=0.9+yy*TC-z0*TS; tz=yy*TS+z0*TC; } }
        else { tx=bx; ty=by; tz=bz; }
        // gentle grow-in of the rose from the stem bottom
        if(i<ROSE_END){ const g=Math.min(1,phaseT/2.2); ty = -1.1 + (ty+1.1)*(0.2+0.8*g); tx*=0.3+0.7*g; tz*=0.3+0.7*g; }
        // fit the whole final scene (rose + text) comfortably on screen
        tx*=0.9; tz*=0.9; ty=ty*0.9+0.4;
      } else {
        const w=0.025*Math.sin(time*1.6+rnd[i]*30);
        tx=tgt[j]+w; ty=tgt[j+1]+0.025*Math.cos(time*1.3+rnd[i]*20); tz=tgt[j+2];
      }
      const k=1-Math.pow(1-ease[i],f);
      pos[j]+=(tx-pos[j])*k; pos[j+1]+=(ty-pos[j+1])*k; pos[j+2]+=(tz-pos[j+2])*k;
      const kc=Math.min(1,k*1.5);
      col[j]+=(tcol[j]-col[j])*kc; col[j+1]+=(tcol[j+1]-col[j+1])*kc; col[j+2]+=(tcol[j+2]-col[j+2])*kc;
    }
    geo.attributes.position.needsUpdate=true; geo.attributes.color.needsUpdate=true;

    group.rotation.y += ((mx*0.5) - group.rotation.y)*0.05;
    group.rotation.x += ((my*0.3) - group.rotation.x)*0.05;
    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

// ================= 16-dekabr: teskari sanoq va sovg'a =================
let API = 'https://bilolsai-api.onrender.com';
const DEFAULT_OPEN = 1797361200; // 2026-12-16 00:00 Toshkent
let openAt = DEFAULT_OPEN, skew = 0, question = 'Meni qanchalik sevasiz? ♡';
const $ = id => document.getElementById(id);
const DONE_KEY = 'malika_gift_done';
const ready = (async () => {
  try { const t = await (await fetch('/index.html', {cache:'no-store'})).text();
        const m = t.match(/const\s+RAILWAY_URL\s*=\s*"([^"]+)"/); if (m) API = m[1].replace(/\/$/, ''); } catch(e){}
  try { const j = await (await fetch(API + '/api/gift/state', {cache:'no-store'})).json();
        if (j && j.success){ openAt = j.openAt || DEFAULT_OPEN; skew = j.now*1000 - Date.now(); if (j.question) question = j.question; } } catch(e){}
})();
const now = () => Date.now() + skew;
const pad = n => String(n).padStart(2,'0');
function setNum(id, v){ const el=$(id); if (el.textContent!==v){ el.textContent=v; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); } }

let cdTimer=null;
async function startCountdown(){
  await ready;
  $('cd').classList.add('on');
  const done = localStorage.getItem(DONE_KEY);
  const loop = () => {
    const left = openAt*1000 - now();
    if (done){ showDoneHeader(); return; }
    if (left <= 0){
      clearInterval(cdTimer);
      $('cdTitle').textContent = '16-dekabr keldi!';
      $('cdRow').style.display = 'none';
      $('cdSub').textContent = 'sovg\'angiz tayyor ♡';
      $('giftBtn').classList.remove('hide');
      return;
    }
    const s = Math.floor(left/1000);
    setNum('cdD', pad(Math.floor(s/86400))); setNum('cdH', pad(Math.floor(s%86400/3600)));
    setNum('cdM', pad(Math.floor(s%3600/60))); setNum('cdS', pad(s%60));
  };
  loop(); if (!done) cdTimer = setInterval(loop, 250);
}
function showDoneHeader(){
  $('cdTitle').textContent = 'sovg\'a yo\'lda'; $('cdRow').style.display='none';
  $('cdSub').textContent = 'Bilol\'dan sovg\'ani kuting ♡'; $('giftBtn').classList.add('hide');
}
function step(n){ ['st1','st2','st3'].forEach((id,i)=>$(id).classList.toggle('on', i===n-1)); }
function hearts(x, y){
  for (let i=0;i<18;i++){
    const h=document.createElement('div'); h.className='heart'; h.textContent=['💖','💗','💕','♡','✨'][i%5];
    const a=Math.random()*Math.PI*2, d=80+Math.random()*160;
    h.style.left=x+'px'; h.style.top=y+'px';
    h.style.setProperty('--dx', Math.cos(a)*d+'px'); h.style.setProperty('--dy', Math.sin(a)*d-60+'px'); h.style.setProperty('--r', (Math.random()*80-40)+'deg');
    document.body.appendChild(h); setTimeout(()=>h.remove(), 1700);
  }
}
$('giftBtn').onclick = e => {
  hearts(e.clientX, e.clientY);
  $('qText').textContent = question; step(1);
  setTimeout(()=>{ $('ov').classList.add('on'); $('ans').focus(); }, 350);
};
$('b1').onclick = e => {
  if (!$('ans').value.trim()){ $('e1').textContent = 'Biror narsa yozing ♡'; return; }
  $('e1').textContent=''; hearts(e.clientX||innerWidth/2, e.clientY||innerHeight/2); step(2); setTimeout(()=>$('card').focus(), 300);
};
$('card').addEventListener('input', () => {
  const d = $('card').value.replace(/\D/g,'').slice(0,19);
  $('card').value = d.replace(/(.{4})/g,'$1 ').trim();
});
$('b2').onclick = async e => {
  const card = $('card').value.replace(/\D/g,''), name = $('fio').value.trim();
  if (card.length < 16){ $('e2').textContent = 'Karta raqami 16 ta raqam bo\'lishi kerak'; return; }
  if (name.split(/\s+/).length < 2){ $('e2').textContent = 'Ism va familiyani yozing'; return; }
  $('e2').textContent=''; const b=$('b2'); b.disabled=true; b.textContent='Yuborilyapti…';
  try {
    const r = await fetch(API + '/api/gift/submit', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({answer: $('ans').value.trim(), card, name})});
    const j = await r.json().catch(()=>({}));
    if (!j.success) throw new Error(j.error || 'Xato');
    localStorage.setItem(DONE_KEY, '1');
    hearts(e.clientX||innerWidth/2, e.clientY||innerHeight/2); step(3); showDoneHeader();
    setTimeout(()=>$('ov').classList.remove('on'), 5000);
  } catch(err){
    $('e2').textContent = (err && err.message && err.message!=='Failed to fetch') ? err.message : 'Internet yoki server xatosi, qayta urinib ko\'ring';
  } finally { b.disabled=false; b.textContent='Yuborish ♡'; }
};
})();
