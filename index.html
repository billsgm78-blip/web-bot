<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bilols AI — suhbat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B0620;
    --bg-panel:#150C33;
    --bg-panel-2:#1C1140;
    --cyan:#45F0C4;
    --violet:#9B6BFF;
    --pink:#FF6FB0;
    --text:#F4F1FF;
    --muted:#A79EC9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  h1{font-family:'Sora',sans-serif;}

  /* ---------- Animated background ---------- */
  .bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 0%, #1a0f45 0%, var(--bg-deep) 62%);}
  .orb{position:absolute; border-radius:50%; filter:blur(70px); mix-blend-mode:screen; will-change:transform;}
  .o1{width:52vmax; height:52vmax; background:var(--violet); opacity:.5; top:-18vmax; left:-14vmax; animation:d1 24s ease-in-out infinite;}
  .o2{width:46vmax; height:46vmax; background:var(--cyan); opacity:.32; bottom:-16vmax; right:-12vmax; animation:d2 28s ease-in-out infinite;}
  .o3{width:38vmax; height:38vmax; background:var(--pink); opacity:.28; top:35%; left:40%; animation:d3 32s ease-in-out infinite;}
  @keyframes d1{50%{transform:translate(18vmax,12vmax) scale(1.15);}}
  @keyframes d2{50%{transform:translate(-16vmax,-10vmax) scale(1.2);}}
  @keyframes d3{50%{transform:translate(-14vmax,10vmax) scale(.85);}}
  .stars i{position:absolute; border-radius:50%; background:#fff; opacity:.2; animation:twinkle ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12; transform:scale(1);} 50%{opacity:.9; transform:scale(1.7);}}
  @media (prefers-reduced-motion:reduce){.orb,.stars i{animation:none;}}

  .app{flex:1; min-height:0; width:100%; max-width:760px; margin:0 auto; position:relative; z-index:1;
    display:flex; flex-direction:column;
    background:rgba(11,6,32,.55); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);}
  @media (min-width:800px){
    .app{margin:24px auto; border-radius:26px; border:1px solid rgba(244,241,255,.12); overflow:hidden;
      box-shadow:0 40px 90px -30px rgba(0,0,0,.7);}
  }

  /* ---------- Header ---------- */
  header{flex:0 0 auto; padding:16px 20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(244,241,255,.08);}
  header .dot{width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  header .title{font-family:'Sora',sans-serif; font-weight:700;}

  /* ---------- Screens ---------- */
  .screen{flex:1; display:flex; min-height:0;}
  .screen[hidden]{display:none;}

  /* ---------- Registration ---------- */
  #regScreen{align-items:center; justify-content:center; padding:24px;}
  .reg-card{width:100%; max-width:360px; text-align:center;}
  .reg-card h1{font-size:1.5rem; margin-bottom:8px;}
  .reg-card p{color:var(--muted); font-size:.95rem; margin-bottom:26px;}
  #regForm{display:flex; flex-direction:column; gap:12px;}
  #regForm input{background:var(--bg-panel); border:1px solid rgba(244,241,255,.12); border-radius:14px; padding:14px 16px; color:var(--text); font-family:'Manrope',sans-serif; font-size:1rem;}
  #regForm input:focus{outline:2px solid var(--cyan);}
  #regForm button{margin-top:6px; background:linear-gradient(135deg,var(--cyan),var(--violet)); border:none; border-radius:14px; padding:15px; font-weight:700; color:#0B0620; font-size:1rem; cursor:pointer;}
  .reg-error{color:var(--pink); font-size:.85rem; min-height:1.2em; margin-top:10px;}

  /* ---------- Chat ---------- */
  #chatScreen{flex-direction:column; min-height:0;}
  .chat-body{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:82%; padding:11px 15px; border-radius:16px; font-size:.94rem; line-height:1.45;}
  .msg.bot{align-self:flex-start; background:var(--bg-panel-2); border-bottom-left-radius:4px;}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#0B0620; font-weight:600; border-bottom-right-radius:4px;}
  .msg img{max-width:100%; border-radius:10px; display:block; margin-top:6px;}
  .msg.typing{align-self:flex-start; background:var(--bg-panel-2); border-bottom-left-radius:4px; display:flex; gap:4px; padding:13px 15px;}
  .msg.typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite;}
  .msg.typing span:nth-child(2){animation-delay:.2s;} .msg.typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .preview-row{padding:0 16px; display:none; align-items:center; gap:10px;}
  .preview-row.show{display:flex;}
  .preview-row img{width:52px; height:52px; object-fit:cover; border-radius:10px;}
  .preview-row button{background:none; border:none; color:var(--pink); font-size:.85rem; cursor:pointer;}

  #chatForm{flex:0 0 auto; display:flex; gap:8px; padding:12px 14px; border-top:1px solid rgba(244,241,255,.08);}
  #photoBtn, #cameraBtn{flex:0 0 auto; width:46px; height:46px; border-radius:12px; border:1px solid rgba(244,241,255,.15); background:var(--bg-panel-2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #chatInput{flex:1; min-width:0; background:var(--bg-panel-2); border:1px solid rgba(244,241,255,.12); border-radius:12px; padding:0 14px; color:var(--text); font-family:'Manrope',sans-serif; font-size:.95rem;}
  #chatInput:focus{outline:2px solid var(--cyan);}
  #chatForm button[type="submit"]{flex:0 0 auto; background:linear-gradient(135deg,var(--cyan),var(--violet)); border:none; border-radius:12px; padding:0 18px; font-weight:700; color:#0B0620; cursor:pointer;}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  <div class="stars" id="stars"></div>
</div>

<div class="app">

<header>
  <span class="dot"></span>
  <span class="title">AI Bot</span>
</header>

<div class="screen" id="regScreen">
  <div class="reg-card">
    <h1>AI bilan suhbat</h1>
    <p>Boshlash uchun ismingiz va telefon raqamingizni kiriting.</p>
    <form id="regForm">
      <input type="text" id="regName" placeholder="Ismingiz" autocomplete="name" required>
      <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" autocomplete="tel" required>
      <button type="submit">Boshlash</button>
    </form>
    <div class="reg-error" id="regError"></div>
  </div>
</div>

<div class="screen" id="chatScreen" hidden style="flex-direction:column;">
  <div class="chat-body" id="chatBody"></div>
  <div class="preview-row" id="previewRow">
    <img id="previewImg" alt="">
    <button type="button" id="previewRemove">olib tashlash</button>
  </div>
  <form id="chatForm">
    <input type="file" id="photoInput" accept="image/*" hidden>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <button type="button" id="photoBtn" aria-label="Galereyadan tanlash">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h4l1.5-2h5L16 7h4v12H4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button type="button" id="cameraBtn" aria-label="Kamerani ochish">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <input type="text" id="chatInput" placeholder="Xabar yozing..." autocomplete="off">
    <button type="submit">Yuborish</button>
  </form>
</div>

</div>

<script>
  (function(){
    const box = document.getElementById('stars');
    for (let i = 0; i < 50; i++){
      const s = document.createElement('i');
      const size = Math.random() * 2.2 + 0.8;
      s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${3+Math.random()*5}s;animation-delay:${-Math.random()*6}s`;
      box.appendChild(s);
    }
  })();
</script>

<script>
  const regScreen = document.getElementById('regScreen');
  const chatScreen = document.getElementById('chatScreen');
  const regForm = document.getElementById('regForm');
  const regName = document.getElementById('regName');
  const regPhone = document.getElementById('regPhone');
  const regError = document.getElementById('regError');

  const chatBody = document.getElementById('chatBody');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photoInput');
  const cameraBtn = document.getElementById('cameraBtn');
  const cameraInput = document.getElementById('cameraInput');
  const previewRow = document.getElementById('previewRow');
  const previewImg = document.getElementById('previewImg');
  const previewRemove = document.getElementById('previewRemove');

  let history = [];
  let pendingImageBase64 = null;

  function showChat(name){
    regScreen.hidden = true;
    chatScreen.hidden = false;
    if (!chatBody.hasChildNodes()){
      addMessage('bot', (name ? `Salom, ${name}! ` : 'Salom! ') + 'Savolingizni yozing yoki rasm yuboring.');
    }
  }

  const savedPhone = localStorage.getItem('web_user_phone');
  const savedName = localStorage.getItem('web_user_name') || '';
  if (savedPhone) showChat(savedName);

  regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    regName.blur();
    regPhone.blur();
    const name = regName.value.trim();
    const phone = regPhone.value.trim();
    regError.textContent = '';

    if (!phone){
      regError.textContent = 'Telefon raqamingizni kiriting.';
      return;
    }

    try {
      const resp = await fetch('/.netlify/functions/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Xatolik yuz berdi');

      localStorage.setItem('web_user_phone', phone);
      localStorage.setItem('web_user_name', name);
      showChat(name);
    } catch (err) {
      regError.textContent = 'Xatolik: ' + err.message;
    }
  });

  function addMessage(role, text, imgSrc){
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    if (text) div.appendChild(document.createTextNode(text));
    if (imgSrc){
      const img = document.createElement('img');
      img.src = imgSrc;
      div.appendChild(img);
    }
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
    return div;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
    return div;
  }

  function resizeImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const maxW = 1024;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  photoBtn.addEventListener('click', () => photoInput.click());
  cameraBtn.addEventListener('click', () => cameraInput.click());

  async function handlePickedFile(input){
    const file = input.files[0];
    if (!file) return;
    const dataUrl = await resizeImage(file);
    pendingImageBase64 = dataUrl.split(',')[1];
    previewImg.src = dataUrl;
    previewRow.classList.add('show');
  }

  photoInput.addEventListener('change', () => handlePickedFile(photoInput));
  cameraInput.addEventListener('change', () => handlePickedFile(cameraInput));

  previewRemove.addEventListener('click', () => {
    pendingImageBase64 = null;
    photoInput.value = '';
    cameraInput.value = '';
    previewRow.classList.remove('show');
  });

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    chatInput.blur();
    const text = chatInput.value.trim();
    if (!text && !pendingImageBase64) return;

    const parts = [];
    if (pendingImageBase64) parts.push({ inline_data: { mime_type: 'image/jpeg', data: pendingImageBase64 } });
    parts.push({ text: text || "Rasmda nima tasvirlangan? O'zbek tilida qisqa tushuntir." });

    addMessage('user', text, pendingImageBase64 ? previewImg.src : null);
    history.push({ role: 'user', parts });

    chatInput.value = '';
    pendingImageBase64 = null;
    photoInput.value = '';
    cameraInput.value = '';
    previewRow.classList.remove('show');

    const typingEl = addTyping();

    try {
      const resp = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history }),
      });
      const data = await resp.json();
      typingEl.remove();
      if (!resp.ok) throw new Error(data.error || 'Xatolik yuz berdi');

      addMessage('bot', data.text);
      history.push({ role: 'model', parts: [{ text: data.text }] });
      if (history.length > 20) history = history.slice(-20);
    } catch (err) {
      typingEl.remove();
      addMessage('bot', 'Xatolik: ' + err.message);
    }
  });
</script>

</body>
</html>
