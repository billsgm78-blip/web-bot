<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI bilan suhbat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f1235 0%, #110d26 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        p.subtitle {
            font-size: 14px;
            color: #c4b5fd;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: none;
            background: #eef2ff;
            color: #1e1b4b;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.6);
        }
        button.start-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #4ade80 0%, #a855f7 100%);
            color: #111827;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button.start-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        button.start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #result-box {
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
            word-break: break-word;
        }
        .error {
            color: #f43f5e;
        }
        .success {
            color: #4ade80;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>AI bilan suhbat</h2>
    <p class="subtitle">Boshlash uchun ismingiz va telefon raqamingizni kiriting.</p>

    <div class="input-group">
        <input type="text" id="name-input" placeholder="Ismingiz">
    </div>
    <div class="input-group">
        <input type="text" id="phone-input" placeholder="Telefon raqamingiz (masalan, +998901234567)">
    </div>

    <button id="start-btn" class="start-btn">Boshlash</button>
    <div id="result-box"></div>
</div>

<script>
    const startBtn = document.getElementById("start-btn");
    const nameInput = document.getElementById("name-input");
    const phoneInput = document.getElementById("phone-input");
    const resultBox = document.getElementById("result-box");

    startBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();

        if (!phone) {
            resultBox.className = "error";
            resultBox.innerText = "Iltimos, telefon raqamingizni kiriting!";
            return;
        }

        resultBox.className = "";
        resultBox.innerText = "Yuborilmoqda... ⏳";
        startBtn.disabled = true;

        try {
            // Запрос отправляется напрямую к серверной функции Vercel
            const response = await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, phone })
            });

            const rawText = await response.text();
            let data = {};
            try {
                data = JSON.parse(rawText);
            } catch (jsonErr) {
                throw new Error("Serverdan kutilmagan javob keldi (404 yoki xato sahifasi)");
            }

            if (!response.ok) {
                throw new Error(data.error || `Server xatosi: ${response.status}`);
            }

            resultBox.className = "success";
            resultBox.innerText = "Muvaffaqiyatli ro'yxatdan o'tdingiz! ✅";
            
            // Если требуется переход на страницу чата или очистка полей:
            setTimeout(() => {
                nameInput.value = "";
                phoneInput.value = "";
            }, 2000);

        } catch (err) {
            resultBox.className = "error";
            resultBox.innerText = `Xatolik: ${err.message}`;
        } finally {
            startBtn.disabled = false;
        }
    });
</script>

</body>
</html>
