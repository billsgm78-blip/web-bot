<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06070a">
<title>Bilols AI — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/fonts/twemoji.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/emoji.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #05070f; --panel: #0b1020; --card: rgba(255,255,255,0.035); --line: rgba(255,255,255,0.08); --line2: rgba(255,255,255,0.14);
    --text: #eef1f8; --muted: #8b95ad; --dim: #5d6680;
    --violet: #8b5cf6; --blue: #3b82f6; --teal: #14d8b8; --green: #10b981; --red: #f43f5e; --amber: #f59e0b;
    --grad: linear-gradient(135deg, #10b981 0%, #3b82f6 50%, #8b5cf6 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Twemoji', 'Outfit', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); min-height: 100%; }
body { min-height: 100svh; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; color: var(--text); }
.mono { font-family: 'Twemoji', 'JetBrains Mono', ui-monospace, monospace; }
.glow-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(60% 40% at 15% 0%, rgba(139,92,246,0.16), transparent 70%), radial-gradient(50% 40% at 100% 100%, rgba(20,216,184,0.10), transparent 70%); }

/* ---------- Kirish ---------- */
#auth { position: relative; z-index: 1; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top)); }
.auth-card { width: 100%; max-width: 400px; background: rgba(13,18,32,0.92); border: 1px solid var(--line); border-radius: 24px; padding: 26px 22px 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9); animation: up .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.logo { width: 44px; height: 44px; border-radius: 14px; background: var(--grad); display: grid; place-items: center; font-size: 21px; box-shadow: 0 6px 20px -4px rgba(139,92,246,0.6); }
.brand b { display: block; font-size: 16px; }
.brand small { color: var(--muted); font-size: 12.5px; }
.auth-card h1 { font-size: 23px; font-weight: 800; margin-bottom: 6px; }
.auth-card p.sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 18px; }
.field { position: relative; margin-bottom: 10px; }
.field input, .inp { width: 100%; height: 50px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; }
.field input:focus, .inp:focus, textarea:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,92,246,0.22); }
.eye { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 16px; }
.btn { height: 50px; width: 100%; border: none; border-radius: 14px; background: var(--grad); color: #fff; font-weight: 700; font-size: 15px; box-shadow: 0 10px 24px -12px rgba(139,92,246,0.8); transition: filter .2s, transform .1s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: .65; cursor: progress; }
.btn.ghost { background: rgba(255,255,255,0.05); border: 1px solid var(--line2); box-shadow: none; color: var(--text); }
.btn.danger { background: rgba(244,63,94,0.14); border: 1px solid rgba(244,63,94,0.4); color: #fda4af; box-shadow: none; }
.msg { min-height: 20px; margin-top: 12px; font-size: 13.5px; text-align: center; line-height: 1.45; }
.msg.err { color: #fb7185; } .msg.ok { color: #34d399; }
.code-boxes { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 12px; }
.code-boxes input { width: 100%; min-width: 0; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--line2); outline: none; font-family: 'Twemoji', 'JetBrains Mono', monospace; }
.code-boxes input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20,216,184,0.2); }
.link { background: none; border: none; color: #a5b4fc; font-size: 13.5px; font-weight: 600; margin-top: 12px; width: 100%; }

/* ---------- Panel ---------- */
#app { position: relative; z-index: 1; display: none; min-height: 100svh; }
.layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100svh; }
.side { position: sticky; top: 0; height: 100svh; border-right: 1px solid var(--line); background: rgba(8,11,22,0.85); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; padding-top: calc(18px + env(safe-area-inset-top)); }
.side .brand { margin: 0 6px 16px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 12px; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; text-align: left; transition: background .15s, color .15s; }
.nav:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav.active { background: rgba(139,92,246,0.14); color: #fff; box-shadow: inset 0 0 0 1px rgba(139,92,246,0.3); }
.nav .ico { width: 22px; text-align: center; }
.nav .badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--amber); color: #111; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
.side .spacer { flex: 1; }
.main { min-width: 0; padding: 22px 26px 40px; padding-top: calc(22px + env(safe-area-inset-top)); max-width: 1100px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.top h2 { font-size: 24px; font-weight: 800; }
.top .right { display: flex; gap: 8px; align-items: center; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.icon-btn { height: 38px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line2); background: rgba(255,255,255,0.04); color: var(--text); font-size: 13.5px; font-weight: 600; }
.icon-btn:hover { background: rgba(255,255,255,0.08); }
.mobile-tabs { display: none; }

.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
.kpi { padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.kpi b { display: block; font-size: 24px; font-family: 'Twemoji', 'JetBrains Mono', monospace; letter-spacing: -0.5px; }
.kpi small { color: var(--muted); font-size: 12.5px; }
.kpi.accent { background: linear-gradient(140deg, rgba(139,92,246,0.18), rgba(59,130,246,0.06)); border-color: rgba(139,92,246,0.3); }
.h { font-size: 14px; font-weight: 700; color: #cfd5e6; margin: 18px 0 10px; display: flex; align-items: center; justify-content: space-between; }
.card { padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.alert { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid rgba(245,158,11,0.35); background: rgba(245,158,11,0.10); color: #fbbf24; font-weight: 700; font-size: 14px; margin-bottom: 14px; text-align: left; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.st-chart { position: relative; }
.st-tip { position: absolute; top: 4px; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 3; min-width: 150px; padding: 9px 11px; border-radius: 12px;
    background: rgba(12,14,20,0.96); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 12px 30px -8px rgba(0,0,0,0.7); font-size: 12.5px; color: #eef1f7; }
.st-tip.on { opacity: 1; }
.st-tip b { display: block; font-size: 11.5px; color: #8a93a8; margin-bottom: 6px; font-weight: 600; }
.st-tip div { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.st-tip i { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 9px; }
.st-tip span { color: #b7bfd0; white-space: nowrap; }
.st-tip em { margin-left: auto; padding-left: 10px; white-space: nowrap; font-style: normal; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.st-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .st-duo { grid-template-columns: 1fr; } }
.st-mini-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.st-mini-h b { font-size: 13.5px; color: var(--text); font-weight: 700; }
.st-mini-h span { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
.st-models { display: flex; flex-direction: column; gap: 12px; }
.st-model { display: grid; grid-template-columns: minmax(110px, 200px) 1fr auto; align-items: center; gap: 12px; }
.st-model-nm { font-size: 13px; color: var(--text); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-model-bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.05); overflow: hidden; }
.st-model-bar i { display: block; height: 100%; border-radius: 99px; background: #8b5cf6; }
.st-model-v { text-align: right; min-width: 110px; }
.st-model-v b { font-size: 13.5px; font-family: 'JetBrains Mono', monospace; color: var(--text); }
.st-model-v small { display: block; font-size: 11.5px; color: var(--muted); }
@media (max-width: 600px) { .st-model { grid-template-columns: 1fr auto; } .st-model-bar { grid-column: 1 / -1; grid-row: 2; } }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.row.click { cursor: pointer; border-radius: 12px; padding: 12px 8px; }
.row.click:hover { background: rgba(255,255,255,0.03); }
.r-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; background: rgba(255,255,255,0.05); }
.r-ico.in { background: rgba(16,185,129,0.12); } .r-ico.out { background: rgba(244,63,94,0.10); }
.r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.r-main b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-main small { color: var(--dim); font-size: 12px; margin-top: 2px; }
.r-amt { text-align: right; font-family: 'Twemoji', 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; white-space: nowrap; }
.r-amt.in { color: #34d399; } .r-amt.out { color: #fb7185; }
.r-amt small { display: block; font-size: 11px; color: var(--dim); font-weight: 500; }
.tag { align-self: flex-start; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
.tag.pending { background: rgba(245,158,11,0.14); color: #fbbf24; } .tag.done { background: rgba(16,185,129,0.14); color: #34d399; }
.tag.off { background: rgba(148,163,184,0.14); color: #94a3b8; } .tag.red { background: rgba(244,63,94,0.15); color: #fb7185; }
.sq { width: 40px; height: 40px; flex-shrink: 0; border-radius: 11px; border: 1px solid var(--line2); background: rgba(255,255,255,0.04); color: var(--text); font-size: 16px; }
.sq:hover { background: rgba(255,255,255,0.09); }
.filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.filters button { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.filters button.active { background: rgba(255,255,255,0.09); color: #fff; }
.sum { color: var(--muted); font-size: 12.5px; margin: 6px 2px 4px; }
.empty { color: var(--dim); text-align: center; padding: 36px 10px; font-size: 14px; }
.loading { color: var(--dim); text-align: center; padding: 36px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; }
.act { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(255,255,255,0.04); color: var(--text); font-size: 13.5px; font-weight: 600; }
.act:hover { background: rgba(255,255,255,0.09); }
.act.red { border-color: rgba(244,63,94,0.4); color: #fda4af; background: rgba(244,63,94,0.08); }
.back { background: none; border: none; color: #a5b4fc; font-weight: 700; font-size: 14px; padding: 2px 0 12px; }
.user-head b { font-size: 20px; } .user-head small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.form { display: grid; gap: 10px; }
.form-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.lb { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.lb .inp { height: 46px; }
.lb small { color: var(--dim); font-weight: 500; }
select.inp { color: inherit; appearance: auto; }
select.inp option { background: #0d1222; color: #e8ecf8; }
textarea.inp { height: auto; min-height: 150px; padding: 14px 16px; resize: vertical; line-height: 1.5; outline: none; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); font-size: 15px; }
.switch { position: relative; width: 52px; height: 30px; border-radius: 16px; background: rgba(255,255,255,0.14); border: 1px solid var(--line2); flex-shrink: 0; transition: background .25s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.3,1.4,.6,1); }
.switch.on { background: var(--red); border-color: transparent; }
.switch.on::after { transform: translateX(22px); }
.set-line { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.set-line b { font-size: 15px; } .set-line small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.preview { margin-top: 10px; padding: 14px; border-radius: 14px; background: #17212b; border: 1px solid rgba(255,255,255,0.06); font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.preview b { display: block; margin-bottom: 6px; }
.copy { cursor: pointer; }
.uses { margin: 0 0 6px 52px; border-left: 2px solid rgba(139,92,246,0.35); padding-left: 10px; }
.uses:empty { display: none; }
@media (max-width: 860px) { .uses { margin-left: 12px; } }
.copy:hover { text-decoration: underline; }

/* toast va oyna */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 100; padding: 12px 18px; border-radius: 14px; background: #111827; border: 1px solid var(--line2); font-size: 14px; font-weight: 600; transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#modal { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(2,4,10,0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#modal.open { display: flex; }
.m-card { width: 100%; max-width: 420px; background: #0d1222; border: 1px solid var(--line2); border-radius: 20px; padding: 20px; animation: up .3s cubic-bezier(.2,.8,.2,1) both; }
.m-card h3 { font-size: 18px; margin-bottom: 4px; } .m-card p { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.m-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }


/* ---------- Boshqaruv ---------- */
.lock-hero { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); transition: border-color .25s, background .25s; }
.lock-hero.on { border-color: rgba(244,63,94,0.55); background: rgba(244,63,94,0.08); }
.lock-hero .big { font-size: 30px; }
.lock-hero b { font-size: 16px; display: block; } .lock-hero small { color: var(--muted); font-size: 13px; }
.lock-hero .grow { flex: 1; min-width: 0; }
.feat { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
.feat.off { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.06); }
.feat .name { font-weight: 700; font-size: 14.5px; } .feat .state { font-size: 12px; color: var(--muted); }
.feat.off .state { color: #fbbf24; }
.feat .inp { grid-column: 1 / -1; height: 42px; font-size: 14px; display: none; }
.feat.off .inp { display: block; }
.switch.ok { background: var(--green); border-color: transparent; }
.switch.ok::after { transform: translateX(22px); }
.feat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.pv-phone { width: 260px; height: 460px; margin: 0 auto; border-radius: 30px; border: 1px solid var(--line2); background: #04060d; position: relative; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.pv-lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px; text-align: center;
    background: radial-gradient(70% 50% at 50% 30%, rgba(139,92,246,0.22), transparent 70%), #04060d; }
.pv-lock .i { width: 58px; height: 58px; border-radius: 18px; background: var(--grad); display: grid; place-items: center; font-size: 28px; margin-bottom: 14px; }
.pv-lock b { font-size: 18px; margin-bottom: 8px; } .pv-lock p { font-size: 12.5px; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.pv-chat { position: absolute; inset: 0; background: linear-gradient(160deg, #0b1020, #05070f); }
.pv-chat .bar { height: 46px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; font-weight: 700; }
.pv-chat .bar i { width: 24px; height: 24px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.pv-ban { position: absolute; left: 10px; right: 10px; top: 56px; padding: 10px; border-radius: 12px; font-size: 11.5px; line-height: 1.4; display: flex; gap: 8px; white-space: pre-wrap; word-break: break-word; }
.pv-pop { position: absolute; inset: 0; background: rgba(2,4,10,0.7); display: flex; align-items: center; justify-content: center; padding: 18px; }
.pv-pop > div { width: 100%; border-radius: 16px; padding: 16px; text-align: center; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.pv-pop .ico { font-size: 26px; } .pv-pop b { display: block; font-size: 15px; margin: 4px 0 6px; }
.pv-pop .ok { margin-top: 10px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.16); font-weight: 700; }
.ann-info { background: #0f2747; border: 1px solid rgba(59,130,246,0.5); color: #dbeafe; }
.ann-warning { background: #3a2a07; border: 1px solid rgba(245,158,11,0.55); color: #fde68a; }
.ann-success { background: #0b3326; border: 1px solid rgba(16,185,129,0.5); color: #d1fae5; }
.ann-promo { background: linear-gradient(135deg, #3b1d7a, #1e3a8a); border: 1px solid rgba(167,139,250,0.55); color: #ede9fe; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line2); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.seg button.active { background: rgba(139,92,246,0.18); color: #fff; border-color: rgba(139,92,246,0.45); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--violet); }
@media (max-width: 860px) { .feat-grid, .two { grid-template-columns: 1fr; } .pv-phone { width: 240px; height: 420px; } }

@media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 14px 14px 40px; padding-top: calc(14px + env(safe-area-inset-top)); }
    .mobile-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 14px; padding: 0 14px; -webkit-overflow-scrolling: touch; }
    .mobile-tabs::-webkit-scrollbar { display: none; }
    .mobile-tabs .nav { flex: 0 0 auto; width: auto; padding: 9px 12px; border: 1px solid var(--line); font-size: 13px; }

@keyframes drift2 { to { transform: translate3d(-16vmax, -10vmax, 0) scale(1.1); } }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

        <p class="sub">Telegram botga 6 xonali kod yuborildi. Kod 5 daqiqa amal qiladi.</p>
        <div class="code-boxes" id="code-boxes"></div>
        <button class="btn" id="c-submit">Tasdiqlash</button>
        <div class="msg" id="c-msg"></div>
        <button class="link" id="c-back">← Qaytadan kirish</button>
    </div>
</section>

<!-- ============ PANEL ============ -->
<section id="app">
    <div class="layout">
        <aside class="side">
            <div class="brand"><div class="logo">⚡</div><div><b>Bilols AI</b><small>Admin panel</small></div></div>
            <div id="nav-side"></div>
            <div class="spacer"></div>
            <button class="nav" id="logout-side"><span class="ico">⎋</span>Chiqish</button>
        </aside>
        <main class="main">
            <div class="top">
                <h2 id="page-title">Statistika</h2>
                <div class="right">
                    <span class="chip" id="session-chip">Sessiya faol</span>
                    <button class="icon-btn" id="refresh" title="Yangilash">↻<span class="lbl"> Yangilash</span></button>
                    <button class="icon-btn" id="logout-top">Chiqish</button>
                </div>
            </div>
            <div class="mobile-tabs" id="nav-mobile"></div>
            <div id="view"></div>
        </main>
    </div>
</section>

<div id="modal"><div class="m-card" id="m-card"></div></div>
<div id="toast"></div>

<script>
(function () {
    'use strict';
    // Bot serveri manzili. Har oy Railway almashsa, index.html dagi RAILWAY_URL o'qiladi (bitta joyda o'zgartirish yetarli).
    var API = 'https://ai2-production-7d7e.up.railway.app';
    var apiReady = fetch('/index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
        var m = t.match(/const\s+RAILWAY_URL\s*=\s*"([^"]+)"/);
        if (m) API = m[1].replace(/\/$/, '');
    }).catch(function () {});

    var $ = function (id) { return document.getElementById(id); };
    var TOKEN_KEY = 'bilols_admin_token';
    var token = null, ticket = null, pendingCount = 0, supportUnread = 0, supPhone = null;
    try {
        var saved = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
        if (saved && saved.exp > Date.now()) token = saved.t;
    } catch (e) {}

    function h(tag, attrs, kids) {
        var e = document.createElement(tag);
        if (attrs) for (var k in attrs) {
            if (k === 'class') e.className = attrs[k];
            else if (k === 'text') e.textContent = attrs[k];
            else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
            else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
        }
        (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
        return e;
    }
    function money(n) { return Number(n || 0).toLocaleString('ru-RU').replace(/ /g, ' '); }
    function pad(n) { return ('0' + n).slice(-2); }
    function fmtDate(sec) {
        var d = new Date(sec * 1000), now = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
        if (d.toDateString() === now.toDateString()) return 'Bugun, ' + hm;
        var y = new Date(now); y.setDate(now.getDate() - 1);
        if (d.toDateString() === y.toDateString()) return 'Kecha, ' + hm;
        return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + hm;
    }
    function fmtDay(sec) { var d = new Date(sec * 1000); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
    var toastTimer;
    function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600); }

    async function post(path, body, extraHeaders) {
        await apiReady;
        var r = await fetch(API + path, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, extraHeaders || {}), body: JSON.stringify(body || {}) });
        var j = {};
        try { j = await r.json(); } catch (e) {}
        j._status = r.status;
        return j;
    }
    async function admin(action, body) {
        var j = await post('/api/admin/' + action, body, { 'X-Admin-Token': token || '' });
        if (j._status === 401) { logout(true); throw new Error('auth'); }
        return j;
    }

    // ---------- oyna (prompt/confirm o'rniga — mini app'da ham ishlaydi) ----------
    function dialog(opts) {
        return new Promise(function (resolve) {
            var card = $('m-card'); card.innerHTML = '';
            card.appendChild(h('h3', { text: opts.title }));
            if (opts.text) card.appendChild(h('p', { text: opts.text }));
            var inputs = (opts.fields || []).map(function (f) {
                var inp = f.multiline ? h('textarea', { class: 'inp', placeholder: f.placeholder || '', rows: 4 }) : h('input', { class: 'inp', type: f.type || 'text', placeholder: f.placeholder || '', inputmode: f.inputmode || null });
                if (f.value != null) inp.value = f.value;
                card.appendChild(h('label', { class: 'lb', style: 'margin-bottom:10px' }, [f.label || '', inp]));
                return inp;
            });
            function close(v) { $('modal').classList.remove('open'); resolve(v); }
            var ok = h('button', { class: 'btn' + (opts.danger ? ' danger' : ''), text: opts.ok || 'OK', onclick: function () { close(opts.fields ? inputs.map(function (i) { return i.value.trim(); }) : true); } });
            card.appendChild(h('div', { class: 'm-btns' }, [h('button', { class: 'btn ghost', text: 'Bekor', onclick: function () { close(null); } }), ok]));
            $('modal').classList.add('open');
            setTimeout(function () { (inputs[0] || ok).focus(); }, 60);
            inputs.forEach(function (i) { i.addEventListener('keydown', function (e) { if (e.key === 'Enter' && i.tagName !== 'TEXTAREA') ok.click(); }); });
        });
    }
    $('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') { $('modal').classList.remove('open'); } });

    // ================= KIRISH =================
    $('a-eye').onclick = function () { var p = $('a-pass'); p.type = p.type === 'password' ? 'text' : 'password'; };
    $('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = $('a-submit'), msg = $('a-msg');
        var login = $('a-login').value.trim(), pass = $('a-pass').value;
        if (!login || !pass) { msg.className = 'msg err'; msg.textContent = 'Login va parolni kiriting.'; return; }
        btn.disabled = true; msg.className = 'msg'; msg.textContent = '⏳';
        try {
            var j = await post('/api/admin-auth/login', { login: login, password: pass });
            if (j.success) { ticket = j.ticket; showCode(); }
            else { msg.className = 'msg err'; msg.textContent = j.error || 'Xatolik'; }
        } catch (e2) { msg.className = 'msg err'; msg.textContent = "Server bilan bog'lanib bo'lmadi."; }
        btn.disabled = false;
    });
    // ---------- Maxfiy kalit (23 belgi) — parolsiz va kodsiz ----------
    $('a-keybtn').onclick = function () {
        var f = $('key-form'); f.style.display = f.style.display === 'none' ? '' : 'none';
        if (f.style.display === '') setTimeout(function () { $('a-key').focus(); }, 50);
    };
    $('a-key').addEventListener('input', function () {
        // avtomatik formatlash: BLS-XXXX-XXXX-XXXX-XXXX
        var raw = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (raw.indexOf('BLS') !== 0) raw = raw.length <= 3 && 'BLS'.indexOf(raw) === 0 ? raw : 'BLS' + raw;
        var body = raw.slice(3, 35), parts = ['BLS'];
        for (var i = 0; i < body.length; i += 4) parts.push(body.slice(i, i + 4));
        this.value = raw.length <= 3 ? raw : parts.join('-');
    });
    $('key-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var msg = $('a-msg'), btn = $('a-keygo'), key = $('a-key').value.trim();
        if (key.replace(/[^A-Z0-9]/gi, '').length !== 35) { msg.className = 'msg err'; msg.textContent = "Kalit to'liq emas (43 belgi)."; return; }
        btn.disabled = true; msg.className = 'msg'; msg.textContent = '⏳';
        try {
            var j = await post('/api/admin-auth/key', { key: key });
            if (j.success) {
                token = j.token;
                try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, exp: Date.now() + (j.expiresIn || 43200) * 1000 })); } catch (e2) {}
                $('a-key').value = ''; msg.textContent = '';
                enterApp();
            } else { msg.className = 'msg err'; msg.textContent = j.error || 'Xato'; }
        } catch (e3) { msg.className = 'msg err'; msg.textContent = "Server bilan bog'lanib bo'lmadi."; }
        btn.disabled = false;
    });

    var boxes = [];
    (function buildBoxes() {
        var wrap = $('code-boxes');
        for (var i = 0; i < 6; i++) {
            var b = h('input', { inputmode: 'numeric', maxlength: 1, autocomplete: i === 0 ? 'one-time-code' : 'off', 'aria-label': 'Raqam ' + (i + 1) });
            (function (idx, el) {
                el.addEventListener('input', function () {
                    var v = el.value.replace(/\D/g, '');
                    if (v.length > 1) { fill(v); return; }
                    el.value = v;
                    if (v && idx < 5) boxes[idx + 1].focus();
                    if (code().length === 6) $('c-submit').click();
                });
                el.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !el.value && idx > 0) boxes[idx - 1].focus(); });
                el.addEventListener('paste', function (e) { var t = (e.clipboardData || window.clipboardData).getData('text'); if (t) { e.preventDefault(); fill(t); } });
            })(i, b);
            boxes.push(b); wrap.appendChild(b);
        }
    })();
    function fill(v) { v = v.replace(/\D/g, '').slice(0, 6); boxes.forEach(function (b, i) { b.value = v[i] || ''; }); (boxes[Math.min(v.length, 5)]).focus(); if (v.length === 6) $('c-submit').click(); }
    function code() { return boxes.map(function (b) { return b.value; }).join(''); }
    function showCode() {
        $('step-login').style.display = 'none'; $('step-code').style.display = '';
        boxes.forEach(function (b) { b.value = ''; }); $('c-msg').textContent = '';
        setTimeout(function () { boxes[0].focus(); }, 100);
    }
    $('c-back').onclick = function () { $('step-code').style.display = 'none'; $('step-login').style.display = ''; $('a-msg').textContent = ''; };
    $('c-submit').onclick = async function () {
        var btn = this, msg = $('c-msg');
        if (code().length !== 6) { msg.className = 'msg err'; msg.textContent = '6 ta raqamni kiriting.'; return; }
        btn.disabled = true; msg.className = 'msg'; msg.textContent = '⏳';
        try {
            var j = await post('/api/admin-auth/verify', { ticket: ticket, code: code() });
            if (j.success) {
                token = j.token;
                try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, exp: Date.now() + (j.expiresIn || 43200) * 1000 })); } catch (e) {}
                $('a-pass').value = '';
                enterApp();
            } else {
                msg.className = 'msg err'; msg.textContent = j.error || 'Xatolik';
                if (j.expired) setTimeout(function () { $('c-back').click(); }, 1500);
                else { boxes.forEach(function (b) { b.value = ''; }); boxes[0].focus(); }
            }
        } catch (e2) { msg.className = 'msg err'; msg.textContent = "Server bilan bog'lanib bo'lmadi."; }
        btn.disabled = false;
    };
    function logout(expired) {
        if (token && !expired) { goOffline(); post('/api/admin-auth/logout', { token: token }).catch(function () {}); }
        token = null;
        try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
        $('app').style.display = 'none'; $('auth').style.display = '';
        $('step-code').style.display = 'none'; $('step-login').style.display = ''; $('key-form').style.display = 'none';
        $('a-msg').className = 'msg' + (expired ? ' err' : ''); $('a-msg').textContent = expired ? 'Sessiya tugadi. Qaytadan kiring.' : '';
    }
    $('logout-top').onclick = function () { logout(false); };
    $('logout-side').onclick = function () { logout(false); };

    // ================= PANEL =================
    var TABS = [
        ['stats', '📊', 'Statistika'], ['control', '🚦', 'Boshqaruv'], ['orders', '🛒', 'Buyurtmalar'], ['support', '💬', 'Murojaatlar'], ['tx', '🧾', 'Tarix'], ['users', '👥', 'Foydalanuvchilar'], ['aud', '📲', 'Ilova va bot'],
        ['card', '💳', "Karta (avto to'lov)"], ['promo', '🎟️', 'Promo-kodlar'], ['shop', '🏷', 'Narxlar'], ['ai', '🤖', 'AI sozlamalari'], ['design', '🎨', 'Dizayn'], ['notify', '🔔', 'Bildirishnomalar'], ['msg', '📢', 'Xabar yuborish'], ['settings', '⚙️', 'Sozlamalar'], ['log', '📜', 'Jurnal'], ['security', '🛡', 'Xavfsizlik']
    ];
    var tab = 'stats';
    function buildNav() {
        ['nav-side', 'nav-mobile'].forEach(function (id) {
            var box = $(id); box.innerHTML = '';
            TABS.forEach(function (t) {
                var b = h('button', { class: 'nav' + (t[0] === tab ? ' active' : ''), onclick: function () { go(t[0]); } }, [h('span', { class: 'ico', text: t[1] }), t[2]]);
                if (t[0] === 'orders' && pendingCount) b.appendChild(h('span', { class: 'badge', text: String(pendingCount) }));
                if (t[0] === 'support' && supportUnread) b.appendChild(h('span', { class: 'badge red', text: String(supportUnread) }));
                box.appendChild(b);
            });
        });
    }
    function go(t) {
        if (t !== 'support') supPhone = null;
        tab = t; buildNav();
        $('page-title').textContent = TABS.filter(function (x) { return x[0] === t; })[0][2];
        var view = $('view'); view.innerHTML = '<div class="loading">⏳</div>';
        // Kirish animatsiyasi faqat sahifa ochilganda (keyingi avto-yangilanishlarda qayta o'ynamaydi)
        view.classList.remove('anim'); void view.offsetWidth; view.classList.add('anim');
        clearTimeout(go._t); go._t = setTimeout(function () { view.classList.remove('anim'); }, 1600);
        var fn = { stats: vStats, control: vControl, orders: vOrders, tx: function (v) { vTx(v, 'all', ''); }, users: function (v) { vUsers(v, ''); }, promo: vPromo, msg: vMsg, support: vSupport, shop: vShop, card: vCard, ai: vAI, design: vDesign, notify: vNotify, settings: vSettings, log: vLog, security: vSecurity, aud: vAud }[t];
        Promise.resolve(fn(view)).catch(function (e) { if (e && e.message !== 'auth') view.innerHTML = '<div class="empty">Server xatosi</div>'; });
        window.scrollTo(0, 0);
    }
    $('refresh').onclick = function () { go(tab); };
    function enterApp() {
        $('auth').style.display = 'none'; $('app').style.display = 'block';
        go('stats');
        startPing();
    }

    // ---------- yurak urishi: admin onlayn + yangi murojaatlar ----------
    var pingTimer = null;
    async function ping() {
        if (!token || document.hidden) return;
        try {
            var j = await admin('ping');
            if (!j.success) return;
            var prevU = supportUnread;
            if (j.supportUnread !== supportUnread || j.pendingOrders !== pendingCount) { supportUnread = j.supportUnread; pendingCount = j.pendingOrders; buildNav(); }
            if (supportUnread > prevU) toast('💬 Yangi murojaat keldi');
            if (tab === 'support' && supportUnread > prevU) supRefresh();
        } catch (e) {}
    }
    function startPing() { clearInterval(pingTimer); ping(); pingTimer = setInterval(ping, 4000); }
    // panel yopilsa yoki boshqa ilovaga o'tilsa — saytda darhol "oflayn"
    function goOffline() {
        if (!token) return;
        try { fetch(API + '/api/admin/offline', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ token: token }) }); } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () { if (document.hidden) goOffline(); else ping(); });
    window.addEventListener('pagehide', goOffline);

    // ---------- Murojaatlar ----------
    var supRefresh = function () {}, supLoop = 0;
    async function vSupport(view) {
        var timer = null;
        if (supPhone) return supThread(view, supPhone);
        var j = await admin('support_threads');
        view.innerHTML = '';
        supportUnread = j.unread || 0; buildNav();
        supRefresh = function () { if (tab === 'support' && !supPhone) vSupport(view); };
        view.appendChild(h('div', { class: 'sum', style: 'margin-bottom:10px', text: "Foydalanuvchilar saytdagi «💬 Yordam» orqali yozadi. Siz bu yerdan javob berasiz — javob saytda va Telegram botda boradi. Panel ochiq turganda saytda «🟢 Admin onlayn» ko'rinadi." }));
        if (!(j.threads || []).length) { view.appendChild(h('div', { class: 'empty', text: "Hozircha murojaatlar yo'q" })); return; }
        j.threads.forEach(function (t) {
            view.appendChild(h('div', { class: 'row click', onclick: function () { supPhone = t.phone; supThread(view, t.phone); } }, [
                h('div', { class: 'r-ico', text: '👤' }),
                h('div', { class: 'r-main' }, [
                    h('b', { text: (t.pid ? '🆔 ' + t.pid + ' · ' : '') + (t.name || "Noma'lum") + ' · +' + t.phone }),
                    h('small', { text: (t.lastSender === 'admin' ? 'Siz: ' : '') + (String(t.last || '').slice(0, 90) || '🖼 Rasm') + ' · ' + fmtDate(t.at) })
                ]),
                t.unread ? h('span', { class: 'badge', style: 'background:var(--red);color:#fff;min-width:22px;height:20px;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:800;padding:0 6px', text: String(t.unread) }) : (t.lastSender === 'user' ? h('span', { class: 'tag pending', text: 'Javobsiz' }) : h('span', { class: 'tag done', text: 'Javob berilgan' }))
            ]));
        });
    }
    async function supThread(view, phone) {
        var j = await admin('support_thread', { target: phone });
        view.innerHTML = '';
        var u = j.user || { phone: phone };
        var list = h('div', { class: 'sup-list' });
        var ta = h('textarea', { class: 'inp', placeholder: 'Javob yozing... (Enter — yuborish, Shift+Enter — yangi qator)' });
        var last = '';
        function paint(msgs) {
            var sig = JSON.stringify(msgs.map(function (m) { return [m.id, m.read_by_user]; }));
            if (sig === last) return; last = sig;
            list.innerHTML = '';
            msgs.forEach(function (m) {
                var img = m.image ? h('img', { src: API + '/api/support/img/' + m.image, class: 'sup-img', alt: '' }) : null;
                if (img) { img.onload = function () { list.scrollTop = list.scrollHeight; }; img.onclick = function () { window.open(img.src, '_blank'); }; }
                list.appendChild(h('div', { class: 'sup-msg ' + m.sender }, [img, m.text ? h('span', { text: m.text }) : null, h('small', { text: (m.sender === 'admin' ? 'Siz · ' : '') + fmtDate(m.at) + (m.sender === 'admin' ? (m.read_by_user ? '  ✓✓ o\'qildi' : '  ✓') : '') })]));
            });
            list.scrollTop = list.scrollHeight;
        }
        async function send(image) {
            var t = ta.value.trim(); if (!t && !image) { ta.focus(); return; }
            ta.disabled = true;
            var x = await admin('support_reply', image ? { target: u.phone, text: t, image: image } : { target: u.phone, text: t });
            ta.disabled = false;
            if (!x.success) {
                // eski server rasmni tanimaydi — Railway hali yangilanmagan
                toast(image && /matn yo'q/.test(x.error || '') ? "⏳ Server hali yangilanmoqda — 1-2 daqiqadan so'ng qayta urinib ko'ring" : (x.error || 'Xato'));
                return;
            }
            ta.value = ''; ta.focus();
            toast(x.telegram ? '✅ Yuborildi — saytda va botda' : '✅ Saytga yuborildi (botga kirmagan)');
            reload();
        }
        var ver = j.ver;
        async function reload() {
            if (tab !== 'support' || supPhone !== phone) return;
            var r = await admin('support_thread', { target: phone });
            if (r.success) { ver = r.ver; paint(r.messages || []); }
        }
        // jonli ulanish: yangi xabar yoki "o'qildi" bo'lishi bilan darhol keladi
        var myLoop = ++supLoop;
        (async function live() {
            while (tab === 'support' && supPhone === phone && token && myLoop === supLoop) {
                try {
                    var r = await admin('support_thread', { target: phone, ver: ver });
                    if (tab !== 'support' || supPhone !== phone) break;
                    if (r.success) { ver = r.ver; paint(r.messages || []); } else await new Promise(function (ok) { setTimeout(ok, 3000); });
                } catch (e) { if (e && e.message === 'auth') break; await new Promise(function (ok) { setTimeout(ok, 2000); }); }
            }
        })();
        ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
        var fileIn = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
        fileIn.onchange = function () {
            var f = fileIn.files && fileIn.files[0]; fileIn.value = '';
            if (!f || !/^image\//.test(f.type)) return;
            var fr = new FileReader();
            fr.onload = function () {
                var im = new Image();
                im.onload = function () {
                    var k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
                    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
                    var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
                    toast('⏳ Rasm yuborilmoqda...'); send(c.toDataURL('image/jpeg', 0.82));
                };
                im.src = fr.result;
            };
            fr.readAsDataURL(f);
        };
        view.appendChild(h('div', { class: 'card sup-wrap' }, [
            h('div', { class: 'sup-head' }, [
                h('button', { class: 'sq', title: 'Orqaga', text: '‹', onclick: function () { supPhone = null; vSupport(view); } }),
                h('div', { class: 'r-main' }, [h('b', { text: u.name || "Noma'lum" }), h('small', { text: '+' + u.phone + (u.webOnly ? ' · ⚠️ botga kirmagan — javob faqat saytda ko\'rinadi' : ' · javob botga ham boradi ✈️') })]),
                h('button', { class: 'act', text: '👤 Profil', onclick: function () { supPhone = null; tab = 'users'; buildNav(); $('page-title').textContent = 'Foydalanuvchilar'; vUser(view, u.phone); } })
            ]),
            list,
            h('div', { class: 'sup-bar' }, [fileIn, h('button', { class: 'sq', title: 'Rasm yuborish', style: 'height:46px;width:46px;font-size:19px', text: '📎', onclick: function () { fileIn.click(); } }),
                ta, h('button', { class: 'btn', style: 'width:auto;padding:0 18px;height:46px', text: 'Yuborish', onclick: function () { send(); } })])
        ]));
        paint(j.messages || []);
        ping();
        supRefresh = reload;
        setTimeout(function () { ta.focus(); }, 60);
    }

    // ---------- Karta (avto to'lov) ----------
    var cardStep = '';

            on.onclick = function () { on.classList.toggle('ok'); };
            box.appendChild(h('div', { class: 'card', style: 'margin-bottom:12px' }, [h('div', { class: 'set-line' }, [
                h('div', {}, [h('b', { text: '🔒 Maxfiylik siyosati avtojavobi' }), h('small', { text: (c.account ? 'Akkaunt: ' + c.account + ' · ' : '') + "Kimdir shaxsiy chatda ma'lumotlari, parol, xavfsizlik haqida yozsa — maxfiylik siyosati qisqacha va havolasi bilan javob beriladi." })]), on
            ])]));
            var scope = c.scope || 'contacts';
            var sg = h('div', { class: 'seg' });
            [['contacts', '👥 Faqat kontaktlarim'], ['all', '🌍 Hamma yozganlar']].forEach(function (x) {
                var bt = h('button', { class: scope === x[0] ? 'active' : '', text: x[1] });
                bt.onclick = function () { scope = x[0]; sg.querySelectorAll('button').forEach(function (e) { e.classList.remove('active'); }); bt.classList.add('active'); };
                sg.appendChild(bt);
            });
            var cd = String(c.cooldown || 30);
            var cg = h('div', { class: 'seg' });
            [['30', '🔁 Har safar'], ['3600', '⏱ Soatiga 1 marta'], ['43200', '🕛 12 soatda 1 marta']].forEach(function (x) {
                var bt = h('button', { class: cd === x[0] ? 'active' : '', text: x[1] });
                bt.onclick = function () { cd = x[0]; cg.querySelectorAll('button').forEach(function (e) { e.classList.remove('active'); }); bt.classList.add('active'); };
                cg.appendChild(bt);
            });
            var words = h('textarea', { class: 'inp', style: 'min-height:110px', placeholder: c.defaultWords });
            words.value = c.words || '';
            var form = h('div', { class: 'card form' }, [
                h('div', { class: 'lb' }, ['Kimga javob beriladi', sg]),
                h('div', { class: 'lb' }, ['Bir odam qayta-qayta so\'rasa', cg, h('small', { text: "«Har safar» — har savolga javob (bir odamga 30 soniyada ko'pi bilan bir marta, ketma-ket yozib yuborishdan himoya)." })]),
                h('label', { class: 'lb' }, ["Kalit so'zlar (vergul bilan). Bo'sh qolsa — standart ro'yxat (oqish yozuv) ishlatiladi:", words]),
                h('button', { class: 'btn', text: '💾 Saqlash', onclick: async function () {
                    await admin('privacy_reply', { save: true, on: on.classList.contains('ok'), scope: scope, cooldown: cd, words: words.value });
                    toast('✅ Saqlandi'); vAud(view);
                } })
            ]);
            box.appendChild(form);
            // Sinov
            var tIn = h('input', { class: 'inp', placeholder: "Masalan: ma'lumotlarim xavfsizmi?" });
            var tRes = h('div', { class: 'sum', style: 'margin:0' });
            box.appendChild(h('div', { class: 'h', text: '🧪 Sinab ko\'rish' }));
            box.appendChild(h('div', { class: 'card form' }, [
                h('label', { class: 'lb' }, ["Gap yozing — avtojavob ishlaydimi, tekshiradi:", tIn]),
                h('div', { class: 'actions', style: 'margin:0' }, [
                    h('button', { class: 'act', text: '🔎 Tekshirish', onclick: async function () {
                        if (!tIn.value.trim()) { tIn.focus(); return; }
                        var r = await admin('privacy_test', { text: tIn.value });
                        tRes.textContent = r.match ? '✅ Javob beriladi — kalit so\'z topildi' : "❌ Javob berilmaydi — kalit so'z yo'q (ro'yxatga qo'shing)";
                    } }),
                    h('button', { class: 'act hot', text: '🤖 Virtual sinov (bot begona odam bo\'lib yozadi)', onclick: async function (ev) {
                        var b = ev.currentTarget; b.disabled = true; tRes.textContent = '⏳ Bot akkauntingizga yozyapti…';
                        var r = await admin('privacy_test', { virtual: true, text: tIn.value.trim() });
                        b.disabled = false;
                        if (!r.success) { tRes.textContent = '❌ ' + (r.error || 'Xato'); return; }
                        tRes.textContent = r.replied ? "✅ Ishladi! Telegram'da Bilols bot bilan chatni oching: bot savol yozgan, akkauntingiz esa unga maxfiylik siyosati bilan javob bergan — begona odamga ham xuddi shunday javob ketadi." : "⚠️ Xabar keldi, lekin javob berilmadi — bu gapda kalit so'z yo'q.";
                        setTimeout(function () { vAud(view); }, 2500);
                    } }),
                    h('button', { class: 'act', text: "📩 «Saqlangan xabarlar»ga namuna", onclick: async function () {
                        var r = await admin('privacy_test', { send: true });
                        tRes.textContent = r.sent ? "✅ Yuborildi — Telegram'da «Saqlangan xabarlar» (Saved Messages)ni oching" : '❌ ' + (r.error || 'Yuborilmadi');
                    } })
                ]),
                tRes
            ]));
            box.appendChild(h('div', { class: 'h', text: "Javob matni (ruscha yozganlarga — ruscha)" }));
            box.appendChild(h('div', { class: 'preview', text: String(c.preview || '').replace(/<[^>]+>/g, '') }));
            box.appendChild(h('div', { class: 'h', text: 'Oxirgi avtojavoblar · jami ' + (c.count || 0) }));
            if (!(c.recent || []).length) box.appendChild(h('div', { class: 'empty', text: "Hali hech kimga javob berilmagan" }));
            else {
                var rc = h('div', { class: 'card', style: 'padding:6px 12px' });
                c.recent.forEach(function (r) {
                    rc.appendChild(h('div', { class: 'row' }, [h('div', { class: 'r-ico', text: '🔒' }), h('div', { class: 'r-main' }, [h('b', { text: r.name }), h('small', { text: '«' + r.text + '» · ' + fmtDate(r.at) })])]));
                });
                box.appendChild(rc);
            }
            return;
        }
        if (audTab === 'app') {
            var j = await admin('app_users');
            box.innerHTML = '';
            var pushN = (j.items || []).filter(function (x) { return x.push; }).length;
            var week = (j.items || []).filter(function (x) { return x.last > Date.now() / 1000 - 7 * 86400; }).length;
            box.appendChild(h('div', { class: 'grid kpis' }, [
                kpi("Ilovaga kirganlar", money(j.total || 0), true), kpi('7 kunda faol', week),
                kpi('Bildirishnoma yoqilgan', pushN), kpi('Kirmagan qurilmalar', j.anon || 0)
            ]));
            box.appendChild(h('div', { class: 'sum', text: "Ilovani o'rnatib, akkauntiga kirgan foydalanuvchilar (oxirgi faollik bo'yicha). Bosilsa — profili ochiladi." }));
            if (!(j.items || []).length) { box.appendChild(h('div', { class: 'empty', text: "Hozircha hech kim yo'q. Foydalanuvchilar ilovaga kirgach shu yerda ko'rinadi." })); return; }
            var card = h('div', { class: 'card', style: 'padding:6px 12px' });
            j.items.forEach(function (u) {
                card.appendChild(h('div', { class: 'row click', onclick: function () { tab = 'users'; buildNav(); $('page-title').textContent = 'Foydalanuvchilar'; vUser(view, u.phone); } }, [
                    h('div', { class: 'r-ico', text: u.push ? '📳' : '📱' }),
                    h('div', { class: 'r-main' }, [
                        h('b', { text: u.name + ' · +' + String(u.phone).replace(/\D/g, '') }),
                        h('small', { text: (u.ver ? 'v' + u.ver + ' · ' : '') + 'oxirgi: ' + agoTxt(u.last) + ' · birinchi: ' + (u.first ? fmtDate(u.first) : '—') + (u.devices > 1 ? ' · ' + u.devices + ' ta qurilma' : '') })
                    ]),
                    h('div', { class: 'r-amt' }, [money(u.balance), h('small', { text: u.push ? '🔔 push yoqilgan' : '🔕 push yo\'q' })]),
                    u.push ? h('button', { class: 'act hot', style: 'padding:8px 12px;font-size:12.5px;margin-left:6px', text: '🔔 Sinov', onclick: async function (ev) {
                        ev.stopPropagation();
                        var b = ev.currentTarget; b.disabled = true; b.textContent = '⏳';
                        var r = await admin('push_test', { target: u.phone });
                        b.disabled = false; b.textContent = '🔔 Sinov';
                        var lines = (r.results || []).map(function (x) { return (x.status === 200 ? '✅ ' : '❌ ') + x.token + ' — ' + (x.status === 200 ? 'yuborildi' : (x.error || x.status)) + (x.removed ? ' (eskirgan, o\'chirildi)' : ''); });
                        dialog({ ok: 'Yopish', title: r.success ? '✅ Push yuborildi' : '❌ Push yuborilmadi', text:
                            (r.error ? r.error + '\n\n' : '') + lines.join('\n') + (r.success ? "\n\nTelefonda bildirishnoma chiqishi kerak. Chiqmasa: telefon sozlamalarida Bilols AI bildirishnomalariga ruxsat berilganini va ilova «majburan to'xtatilmagan»ini tekshiring." : '') });
                    } }) : null
                ]));
            });
            box.appendChild(card);
        } else {
            var b = await admin('bot_blocked');
            function paint(b) {
                box.innerHTML = '';
                var c = b.check || {};
                box.appendChild(h('div', { class: 'grid kpis' }, [
                    kpi('Botni bloklaganlar', money(b.total || 0), true),
                    kpi('Oxirgi tekshiruv', c.finished ? agoTxt(c.finished) : (c.running ? 'hozir…' : '—'))
                ]));
                var btn = h('button', { class: 'act', text: c.running ? '⏳ Tekshirilmoqda… ' + (c.done || 0) + '/' + (c.total || 0) : '🔍 Hammasini tekshirish' });
                btn.disabled = !!c.running;
                btn.onclick = async function () {
                    btn.disabled = true; btn.textContent = '⏳ Boshlandi…';
                    var r = await admin('bot_check'); paint(r); poll();
                };
                box.appendChild(h('div', { class: 'actions' }, [btn]));
                box.appendChild(h('div', { class: 'sum', text: "Tekshiruv foydalanuvchiga xabar yubormaydi — faqat bot unga yoza oladimi, shuni sinaydi. Kim botga qaytib yozsa, ro'yxatdan o'zi chiqadi. E'lon tarqatilganda ham bloklaganlar avtomatik qo'shiladi." }));
                if (!(b.items || []).length) { box.appendChild(h('div', { class: 'empty', text: c.finished ? "Hech kim botni bloklamagan 🎉" : "Ro'yxat bo'sh. «Hammasini tekshirish» ni bosing." })); return; }
                var card = h('div', { class: 'card', style: 'padding:6px 12px' });
                b.items.forEach(function (u) {
                    card.appendChild(h('div', { class: 'row' + (u.phone ? ' click' : ''), onclick: function () { if (!u.phone) return; tab = 'users'; buildNav(); $('page-title').textContent = 'Foydalanuvchilar'; vUser(view, u.phone); } }, [
                        h('div', { class: 'r-ico out', text: '🚫' }),
                        h('div', { class: 'r-main' }, [
                            h('b', { text: u.name + (u.phone ? ' · +' + String(u.phone).replace(/\D/g, '') : '') }),
                            h('small', { text: 'Telegram ID ' + u.chat_id + ' · aniqlandi: ' + fmtDate(u.at) })
                        ]),
                        h('div', { class: 'r-amt' }, [money(u.balance), h('small', { text: "so'm" })])
                    ]));
                });
                box.appendChild(card);
            }
            var polling = false;
            async function poll() {
                if (polling) return; polling = true;
                while (tab === 'aud' && audTab === 'blocked') {
                    await new Promise(function (r) { setTimeout(r, 1500); });
                    if (tab !== 'aud' || audTab !== 'blocked') break;
                    var r = await admin('bot_blocked'); paint(r);
                    if (!(r.check || {}).running) break;
                }
                polling = false;
            }
            paint(b);
            if ((b.check || {}).running) poll();
        }
    }

    // ---------- Xavfsizlik ----------
    async function vSecurity(view) {
        view.innerHTML = '';
        // Maxfiy kalit
        view.appendChild(h('div', { class: 'h', text: '🗝 Maxfiy kalit (43 belgi)' }));
        var keyCard = h('div', { class: 'card form' });
        view.appendChild(keyCard);
        async function paintKey() {
            keyCard.innerHTML = '';
            var j = await admin('key_status');
            keyCard.appendChild(h('div', { class: 'sum', style: 'line-height:1.55', text: "Shu kalit bilan login, parol va Telegram kodisiz to'g'ridan-to'g'ri kirasiz. Kalit faqat yaratilganda bir marta ko'rsatiladi — xavfsiz joyga saqlang. Kalit bilan kirilganda botga xabar keladi." }));
            keyCard.appendChild(h('div', { class: 'row', style: 'border:none' }, [
                h('div', { class: 'r-ico', text: j.has ? '🗝' : '—' }),
                h('div', { class: 'r-main' }, [h('b', { text: j.has ? 'Kalit faol' : "Kalit yo'q" }),
                    h('small', { text: j.has ? ('Yaratilgan: ' + (j.created ? fmtDate(j.created) : '?') + ' · oxirgi kirish: ' + (j.last ? fmtDate(j.last) : "hali yo'q")) : "Yangi kalit yarating" })]),
                j.has ? h('button', { class: 'act red', text: "O'chirish", onclick: async function () {
                    if (!await dialog({ title: "Kalitni o'chirish", text: "Bu kalit bilan endi kirib bo'lmaydi.", ok: "O'chirish", danger: true })) return;
                    await admin('key_delete'); toast("O'chirildi"); paintKey();
                } }) : null
            ]));
            keyCard.appendChild(h('button', { class: 'btn', text: j.has ? '🔄 Yangi kalit yaratish (eskisi ishlamay qoladi)' : '🗝 Maxfiy kalit yaratish', onclick: async function () {
                if (j.has && !await dialog({ title: 'Yangi kalit', text: "Eski kalit darhol ishlamay qoladi. Davom etasizmi?", ok: 'Yaratish' })) return;
                var x = await admin('key_create');
                if (!x.success) { toast(x.error || 'Xato'); return; }
                var card = $('m-card'); card.innerHTML = '';
                card.appendChild(h('h3', { text: '🗝 Maxfiy kalitingiz' }));
                card.appendChild(h('p', { text: "Bu kalit faqat HOZIR ko'rsatiladi. Nusxalab, xavfsiz joyga saqlang (masalan, Telegram'dagi «Saqlangan xabarlar»ga emas — qog'ozga yoki parol menejeriga)." }));
                var kb = h('div', { style: 'font-family:Twemoji, ui-monospace,monospace;font-size:17px;font-weight:800;letter-spacing:0.5px;line-height:1.5;text-align:center;padding:18px 12px;border-radius:14px;background:rgba(139,92,246,0.12);border:1px dashed rgba(139,92,246,0.6);margin-bottom:14px;user-select:all;word-break:break-all', text: x.key });
                card.appendChild(kb);
                card.appendChild(h('div', { class: 'm-btns' }, [
                    h('button', { class: 'btn ghost', text: '📋 Nusxalash', onclick: function () { try { navigator.clipboard.writeText(x.key).then(function () { toast('✅ Nusxalandi'); }); } catch (e) { toast('Qo\'lda belgilab nusxalang'); } } }),
                    h('button', { class: 'btn', text: 'Saqladim', onclick: function () { $('modal').classList.remove('open'); paintKey(); } })
                ]));
                $('modal').classList.add('open');
            } }));
        }
        paintKey();
        // parol
        var oldP = h('input', { class: 'inp', type: 'password', autocomplete: 'current-password' });
        var newP = h('input', { class: 'inp', type: 'password', autocomplete: 'new-password' });
        var newP2 = h('input', { class: 'inp', type: 'password', autocomplete: 'new-password' });
        view.appendChild(h('div', { class: 'h', text: 'Admin parolini almashtirish' }));
        view.appendChild(h('div', { class: 'card form' }, [
            h('div', { class: 'form-row', style: 'grid-template-columns:repeat(3,minmax(0,1fr))' }, [
                h('label', { class: 'lb' }, ['Joriy parol', oldP]), h('label', { class: 'lb' }, ['Yangi parol (kamida 8 ta)', newP]), h('label', { class: 'lb' }, ['Yangi parolni takrorlang', newP2])
            ]),
            h('button', { class: 'btn', text: '🛡 Parolni almashtirish', onclick: async function () {
                if (newP.value.length < 8) { toast('Yangi parol kamida 8 ta belgi'); return; }
                if (newP.value !== newP2.value) { toast('Parollar bir xil emas'); return; }
                var x = await admin('admin_password', { oldPassword: oldP.value, newPassword: newP.value });
                if (x.success) { toast('✅ Parol almashtirildi'); oldP.value = newP.value = newP2.value = ''; } else toast(x.error || 'Xato');
            } })
        ]));
        // zaxira
        view.appendChild(h('div', { class: 'h', text: 'Zaxira nusxa' }));
        view.appendChild(h('div', { class: 'card form' }, [
            h('div', { class: 'sum', style: 'margin:0', text: "Bazaning to'liq nusxasi (users.db). Har oy Railway almashtirishdan oldin yuklab oling." }),
            h('button', { class: 'btn ghost', text: '💾 users.db ni yuklab olish', onclick: async function () {
                var btn = this; btn.disabled = true;
                try {
                    await apiReady;
                    var r = await fetch(API + '/api/admin/backup', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token || '' }, body: '{}' });
                    if (r.status === 401) { logout(true); return; }
                    if (!r.ok) { toast('Xato: ' + r.status); return; }
                    var blob = await r.blob(), url = URL.createObjectURL(blob), d = new Date();
                    var a = h('a', { href: url, download: 'users-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.db' });
                    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
                    toast('✅ Yuklab olindi (' + Math.round(blob.size / 1024) + ' KB)');
                } catch (e) { toast("Server bilan bog'lanib bo'lmadi"); }
                finally { btn.disabled = false; }
            } })
        ]));
        // sessiyalar
        view.appendChild(h('div', { class: 'h' }, ['Faol sessiyalar', h('button', { class: 'act red', text: '⎋ Hamma qurilmalardan chiqish', onclick: async function () {
            if (!await dialog({ title: 'Hamma qurilmalardan chiqish', text: 'Barcha sessiyalar, shu jumladan joriysi, yopiladi.', ok: 'Chiqish', danger: true })) return;
            await admin('logout_all'); logout(true);
        } })]));
        var j = await admin('sessions');
        (j.sessions || []).forEach(function (s) {
            var ua = s.ua || '', dev = /iPhone|iPad/.test(ua) ? '📱 iPhone' : /Android/.test(ua) ? '📱 Android' : /Telegram/.test(ua) ? '✈️ Telegram' : '💻 Kompyuter';
            view.appendChild(h('div', { class: 'row' }, [
                h('div', { class: 'r-ico', text: dev.slice(0, 2) }),
                h('div', { class: 'r-main' }, [h('b', { text: dev.slice(2).trim() + (s.current ? ' · shu qurilma' : '') }), h('small', { text: 'IP ' + (s.ip || '?') + ' · oxirgi: ' + fmtDate(s.lastSeen || s.createdAt) + ' · ' + fmtDate(s.expiresAt) + ' gacha' })]),
                s.current ? h('span', { class: 'tag done', text: 'Joriy' }) : null
            ]));
        });
    }

    // ---------- start ----------
    if (token) enterApp();
    else setTimeout(function () { $('a-login').focus(); }, 200);
})();
</script>
</body>
</html>
