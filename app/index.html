<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Bilols AI</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
    <!-- Yuklanish -->
    <section id="splash" class="screen on">
        <div class="splash-in">
            <img src="logo.png" alt="" class="splash-logo">
            <b>Bilols AI</b>
            <div class="spinner"></div>
        </div>
    </section>

    <!-- Sayt bloklangan -->
    <section id="lock" class="screen">
        <div class="center-card">
            <div class="big-ico">🛠</div>
            <h2 id="lock-title"></h2>
            <p id="lock-msg"></p>
            <button class="btn ghost" id="lock-retry" data-t="retry"></button>
        </div>
    </section>

    <!-- Kirish / ro'yxatdan o'tish -->
    <section id="auth" class="screen">
        <div class="auth-top">
            <img src="logo.png" alt="" class="auth-logo">
            <h1>Bilols AI</h1>
            <p data-t="authSub"></p>
        </div>
        <div class="auth-card">
            <div class="seg" id="auth-seg">
                <button class="on" data-mode="login" data-t="login"></button>
                <button data-mode="register" data-t="register"></button>
            </div>
            <label class="field" id="f-name" hidden><span data-t="name"></span><input id="a-name" autocomplete="name" maxlength="40"></label>
            <label class="field"><span data-t="phone"></span>
                <div class="phone-in"><em>+998</em><input id="a-phone" type="tel" inputmode="numeric" placeholder="90 123 45 67" maxlength="14"></div>
            </label>
            <label class="field"><span data-t="password"></span>
                <div class="pass-in"><input id="a-pass" type="password" autocomplete="current-password" maxlength="64"><button type="button" id="a-eye" aria-label="show">👁</button></div>
            </label>
            <label class="field" id="f-code" hidden><span data-t="codeLabel"></span>
                <input id="a-code" inputmode="numeric" maxlength="6" placeholder="••••••" class="code-in">
            </label>
            <div class="auth-msg" id="a-msg"></div>
            <button class="btn primary big" id="a-go" data-t="getCode"></button>
            <button class="link" id="a-forgot" data-t="forgot"></button>
        </div>
        <div class="lang-row" id="auth-lang"></div>
    </section>

    <!-- Asosiy ilova -->
    <section id="main" class="screen">
        <header class="topbar">
            <div class="tb-left">
                <h1 id="tb-title"></h1>
            </div>
            <button class="bal-chip" id="tb-bal"><span class="coin">●</span><b id="tb-bal-v">0</b></button>
            <button class="avatar-btn" id="tb-me" aria-label="profile"><span id="tb-ini">B</span></button>
        </header>
        <div id="ann" class="ann" hidden><span id="ann-text"></span><button id="ann-x">×</button></div>

        <div class="tabs">
            <!-- CHAT -->
            <div class="tab on" id="tab-chat">
                <div class="chat-tools">
                    <button class="pill model" id="c-model"><span id="c-model-t">⚡ Gemini</span><i>▾</i></button>
                    <div class="modes" id="c-modes"></div>
                    <button class="icon-b" id="c-new" aria-label="new">＋</button>
                </div>
                <div class="msgs" id="c-msgs"></div>
                <div class="composer">
                    <div class="att-prev" id="c-att" hidden><img id="c-att-img" alt=""><button id="c-att-x">×</button></div>
                    <div class="comp-row">
                        <button class="icon-b round" id="c-pick" aria-label="photo">
                            <svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
                        </button>
                        <textarea id="c-in" rows="1"></textarea>
                        <button class="send" id="c-send" aria-label="send">
                            <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- RASM -->
            <div class="tab" id="tab-image">
                <div class="scroll pad">
                    <div class="img-hero">
                        <div class="ih-ico">🎨</div>
                        <div><b data-t="imgTitle"></b><small id="i-price"></small></div>
                    </div>
                    <textarea id="i-prompt" class="area" rows="4"></textarea>
                    <div class="chips" id="i-ideas"></div>
                    <button class="btn primary big" id="i-go" data-t="imgGo"></button>
                    <div id="i-result"></div>
                    <h3 class="sec-h" data-t="imgRecent"></h3>
                    <div class="gal" id="i-gal"></div>
                </div>
            </div>

            <!-- DO'KON -->
            <div class="tab" id="tab-shop">
                <div class="scroll pad">
                    <div class="sub-card" id="s-sub"></div>
                    <h3 class="sec-h">⭐ Telegram Stars</h3>
                    <div class="grid2" id="s-stars"></div>
                    <h3 class="sec-h">💎 Telegram Premium</h3>
                    <div class="grid2" id="s-prem"></div>
                    <p class="hint" data-t="shopHint"></p>
                </div>
            </div>

            <!-- HAMYON -->
            <div class="tab" id="tab-wallet">
                <div class="scroll pad">
                    <div class="w-card">
                        <small data-t="balance"></small>
                        <div class="w-bal"><b id="w-bal">0</b><span data-t="sum"></span></div>
                        <div class="w-id">🆔 <b id="w-id">—</b><button class="mini" id="w-id-copy" data-t="copy"></button></div>
                    </div>
                    <div class="w-acts">
                        <button class="w-act" id="w-top"><span>💳</span><b data-t="topup"></b></button>
                        <button class="w-act" id="w-promo"><span>🎟️</span><b data-t="promo"></b></button>
                        <button class="w-act" id="w-bonus"><span>🎁</span><b data-t="bonus"></b></button>
                        <button class="w-act" id="w-ref"><span>👥</span><b data-t="invite"></b></button>
                    </div>
                    <div class="row-h"><h3 class="sec-h" data-t="history"></h3><button class="link" id="w-hist-re" data-t="refresh"></button></div>
                    <div class="hist" id="w-hist"></div>
                </div>
            </div>
        </div>

        <nav class="bnav" id="bnav">
            <button class="on" data-tab="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="tChat"></span></button>
            <button data-tab="image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span data-t="tImage"></span></button>
            <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.3 6.6 19.2l1.3-6-4.5-4 6-.6z"/></svg><span data-t="tShop"></span></button>
            <button data-tab="wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14h2"/></svg><span data-t="tWallet"></span></button>
        </nav>
    </section>

    <!-- Yordam chati (to'liq ekran) -->
    <section id="support" class="screen over">
        <header class="topbar">
            <button class="icon-b" id="sp-back" aria-label="back">
                <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <div class="tb-left sp-head">
                <b data-t="support"></b>
                <small id="sp-status"></small>
            </div>
        </header>
        <div class="msgs" id="sp-msgs"></div>
        <div class="chips sp-tpl" id="sp-tpl"></div>
        <div class="composer">
            <div class="att-prev" id="sp-att" hidden><img id="sp-att-img" alt=""><button id="sp-att-x">×</button></div>
            <div class="comp-row">
                <button class="icon-b round" id="sp-pick" aria-label="photo">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
                </button>
                <textarea id="sp-in" rows="1"></textarea>
                <button class="send" id="sp-send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button>
            </div>
        </div>
    </section>
</div>

<!-- Pastki oyna (sheet) -->
<div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" id="sheet-bg"></div>
    <div class="sheet-card" id="sheet-card"><div class="sheet-grip"></div><div id="sheet-body"></div></div>
</div>
<div id="toasts"></div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<script src="app.js"></script>
</body>
</html>
