            <h1 class="lp-h1"><span>BILOLS</span><span>AI</span></h1>

                <p id="lp-lead"></p>
                <span class="lp-chip" id="lp-chip"></span>

        <div class="lp-cta">

            <button class="lp-login" id="lp-login"></button>
        </div>
        <div class="lp-menu" id="lp-menu" aria-hidden="true">
            <button class="lp-round lp-x" id="lp-menu-x" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

    <!-- Kirish / ro'yxatdan o'tish -->

            <small class="au-sd-foot">© 2026 Bilols AI</small>

        <div class="au-main"><div class="au-box">
        <div class="au-logo" aria-hidden="true"><img src="logo.png" alt=""></div>

            <h1 id="au-title"></h1>
            <p id="au-sub"></p>
        </div>

            <svg class="au-login-art" viewBox="0 0 220 170">

        </div>
        <div class="auth-card au-form">
            <div class="seg" id="auth-seg" hidden>
                <button class="on" data-mode="login" data-t="login"></button>
                <button data-mode="register" data-t="register"></button>
            </div>
            <label class="field" id="f-name" hidden><span data-t="name"></span><input id="a-name" autocomplete="name" maxlength="40"></label>
            <label class="field"><span data-t="phone"></span>
                <div class="phone-in"><em>+998</em><input id="a-phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="90 123 45 67" maxlength="14"></div>
            </label>
            <label class="field"><span data-t="password"></span>
                <div class="pass-in"><input id="a-pass" type="password" autocomplete="current-password" maxlength="64"><button type="button" id="a-eye" aria-label="show">👁</button></div>
            </label>
            <label class="field" id="f-code" hidden><span data-t="codeLabel"></span>
                <input id="a-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" class="code-in">
            </label>
            <div class="consent" id="f-consent" hidden>

                <span id="c-text"></span>
            </div>
            <div class="auth-msg" id="a-msg"></div>
            <button class="link au-forgot" id="a-forgot" data-t="forgot"></button>

                <div class="au-qr-badge" id="qr-badge" hidden></div>
                <p class="au-qr-how" id="qr-how"></p>
                <p class="au-qr-st" id="qr-st"></p>
                <button type="button" class="btn primary big" id="qr-new" hidden></button>
                <button type="button" class="link au-qr-back" id="qr-back"></button>
            </div>
        </div>
        </div>
        <div class="lang-row" id="auth-lang"></div>
        <button class="privacy-link" data-privacy>🔒 <span data-t="privacy"></span></button>
        </div>
    </section>

    <!-- Asosiy ilova -->
    <section id="main" class="screen">
        <header class="topbar bm-top">
            <button class="bm-ib" id="tb-menu" aria-label="menu">
                <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
                <i class="bm-dot" id="tb-menu-dot" hidden></i>
            </button>
            <div class="tb-left bm-center">
                <h1 id="tb-title"></h1>
                <button class="bm-model" id="c-model"><span id="c-model-t">Gemini</span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
            </div>
            <button class="bm-ib" id="c-new" aria-label="new">
                <svg viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button class="bal-chip" id="tb-bal" hidden><span class="coin">●</span><b id="tb-bal-v">0</b></button>
            <button class="avatar-btn" id="tb-me" aria-label="profile" hidden><span id="tb-ini">B</span></button>
        </header>
        <div id="ann" class="ann" hidden><span id="ann-text"></span><button id="ann-x">×</button></div>

        <div class="tabs">
            <!-- CHAT -->
            <div class="tab on" id="tab-chat">
                <div class="modes" id="c-modes" hidden></div>
                <div class="msgs" id="c-msgs"></div>
                <div class="composer bm-comp">
                    <div class="bm-card">

                        <div class="att-prev" id="c-att" hidden><img id="c-att-img" alt=""><button id="c-att-x">×</button></div>
                        <div class="doc-chip" id="c-doc" hidden><span class="dc-ico">📄</span><span class="dc-mid"><b id="c-doc-name"></b><small id="c-doc-info"></small></span><button id="c-doc-x">×</button></div>
                        <textarea id="c-in" rows="1"></textarea>
                        <div class="bm-row">

                            </button>
                            <button class="bm-tool" id="c-mode" aria-label="mode">
                                <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
                            </button>
                            <button class="bm-tool" id="c-img" aria-label="image">
                                <svg viewBox="0 0 24 24"><path d="M4 20L15 9"/><path d="M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 11l.6 1.4L21 13l-1.4.6L19 15l-.6-1.4L17 13l1.4-.6z"/><path d="M15 9l2-2"/></svg>
                            </button>
                            <span class="bm-sp"></span>
                            <button class="send" id="c-send" aria-label="send">
                                <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

                    <div class="img-hero">

                        <div><b data-t="imgTitle"></b><small id="i-price"></small></div>
                    </div>
                    <textarea id="i-prompt" class="area" rows="4"></textarea>
                    <div class="chips" id="i-ideas"></div>
                    <button class="btn primary big" id="i-go" data-t="imgGo"></button>
                    <div id="i-result"></div>
                    <h3 class="sec-h" data-t="imgRecent"></h3>
                    <div class="gal" id="i-gal"></div>
                </div>
            </div>

            <!-- DO'KON -->
            <div class="tab" id="tab-shop">
                <div class="scroll pad">
                    <div class="sub-card" id="s-sub"></div>
                    <h3 class="sec-h">⭐ Telegram Stars</h3>
                    <div class="grid2" id="s-stars"></div>
                    <h3 class="sec-h">💎 Telegram Premium</h3>
                    <div class="grid2" id="s-prem"></div>
                    <p class="hint" data-t="shopHint"></p>
                    <button class="privacy-link" data-privacy>🔒 <span data-t="privacy"></span></button>
                </div>
            </div>

            <!-- HAMYON -->
            <div class="tab" id="tab-wallet">
                <div class="scroll pad">
                    <div class="w-card">
                        <small data-t="balance"></small>
                        <div class="w-bal"><b id="w-bal">0</b><span data-t="sum"></span></div>
                        <div class="w-id">🆔 <b id="w-id">—</b><button class="mini" id="w-id-copy" data-t="copy"></button></div>
                    </div>
                    <div class="w-acts">
                        <button class="w-act" id="w-top"><span>💳</span><b data-t="topup"></b></button>
                        <button class="w-act" id="w-promo"><span>🎟️</span><b data-t="promo"></b></button>
                        <button class="w-act" id="w-bonus"><span>🎁</span><b data-t="bonus"></b></button>
                        <button class="w-act" id="w-ref"><span>👥</span><b data-t="invite"></b></button>
                    </div>
                    <div class="row-h"><h3 class="sec-h" data-t="history"></h3><button class="link" id="w-hist-re" data-t="refresh"></button></div>
                    <div class="hist" id="w-hist"></div>
                    <button class="privacy-link" data-privacy>🔒 <span data-t="privacy"></span></button>
                </div>
            </div>
        </div>

        <nav class="bnav" id="bnav" hidden>
            <button class="on" data-tab="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="tChat"></span></button>
            <button data-tab="image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span data-t="tImage"></span></button>
            <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6L12 16.3 6.6 19.2l1.3-6-4.5-4 6-.6z"/></svg><span data-t="tShop"></span></button>
            <button data-tab="wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14h2"/></svg><span data-t="tWallet"></span></button>
        </nav>
    </section>

    <!-- Yon menyu (Booman uslubida) -->
    <div id="drawer" class="drawer" aria-hidden="true">
        <div class="dr-bg" id="dr-bg"></div>
        <aside class="dr-panel">
            <div class="dr-head">
                <b>Bilols AI</b>
                <button class="bm-ib" id="dr-close" aria-label="close"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
            </div>
            <button class="dr-new" id="dr-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="dr-new-t"></span></button>
            <div class="dr-scroll">
                <div class="dr-sec" id="dr-recent-h"></div>
                <div class="dr-list" id="dr-recent"></div>
                <div class="dr-sec" id="dr-tools-h"></div>
                <div class="dr-list" id="dr-tools"></div>
                <div class="dr-sec" id="dr-acc-h"></div>
                <div class="dr-list" id="dr-acc"></div>
            </div>
            <button class="dr-me" id="dr-me">
                <span class="dr-ava" id="dr-ava">B</span>
                <span class="dr-me-mid"><b id="dr-name"></b><small id="dr-phone"></small></span>
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </button>
        </aside>
    </div>

    <!-- Maxfiylik siyosati (to'liq ekran) -->
    <section id="privacy" class="screen over">
        <header class="topbar">
            <button class="icon-b" id="pv-back" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <div class="tb-left"><b>🔒 <span data-t="privacy"></span></b></div>
        </header>
        <div class="pv-body" id="pv-body"></div>
        <div class="pv-foot">
            <div class="pv-bar"><i id="pv-bar"></i></div>
            <button class="btn primary big" id="pv-ok"></button>
        </div>
    </section>

    <!-- Yordam chati (to'liq ekran) -->
    <section id="support" class="screen over">
        <header class="topbar">
            <button class="icon-b" id="sp-back" aria-label="back">
                <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <div class="tb-left sp-head">
                <b data-t="support"></b>
                <small id="sp-status"></small>
            </div>
        </header>
        <div class="msgs" id="sp-msgs"></div>
        <div class="chips sp-tpl" id="sp-tpl"></div>
        <div class="composer">
            <div class="att-prev" id="sp-att" hidden><img id="sp-att-img" alt=""><button id="sp-att-x">×</button></div>
            <div class="comp-row">
                <button class="icon-b round" id="sp-pick" aria-label="photo">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
                </button>
                <textarea id="sp-in" rows="1"></textarea>
                <button class="send" id="sp-send" aria-label="send"><svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button>
            </div>
        </div>
    </section>
</div>

<!-- Pastki oyna (sheet) -->
<div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" id="sheet-bg"></div>
    <div class="sheet-card" id="sheet-card"><div class="sheet-grip"></div><div id="sheet-body"></div></div>
</div>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
<div id="toasts"></div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-doc" accept=".pdf,.docx,.txt,.md,.csv,.json,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden>
<script src="notify.js"></script>
<script src="app.js"></script>
</body>
</html>
